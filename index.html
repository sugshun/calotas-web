      this.ver[id] = (this.ver[id] || 0) + 1;
      Account.save();
      this.soon(1500);
    },
    /** アカウントにあって、いまのデータにない記録を消す（初回設定・バックアップから戻したとき） */
    prune() {
      const st = Account.st;
      if (!st || !App.data) return;
      const keep = new Set(allKeys().map((k) => Cloud.docId(k)));
      for (const id of liveIds()) if (!keep.has(id)) st.pending[id] = 'del';
      Account.save();
      this.soon(1500);
    },
    /** 「すべてのデータを消去」：アカウントの記録にも消したしるしを付ける */
    wipe() {
      const st = Account.st;
      if (!st) return;
      st.pending = {};
      for (const id of liveIds()) st.pending[id] = 'del';
      Account.save();
      this.soon(300);
    },
    soon(ms) {
      if (!Account.st) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.run(), ms == null ? 1500 : ms);
    },
    start() {
      clearInterval(this.poll);
      if (!Account.st || !Account.usable()) { this.state = 'off'; this.early.clear(); return; }
      const early = Array.from(this.early);
      this.early.clear();
      for (const k of early) this.touch(k);
      this.poll = setInterval(() => { if (!document.hidden) this.run(); }, 45000);
      this.run();
    },
    stop() {
      clearInterval(this.poll);
      clearTimeout(this.timer);
      this.state = 'off';
      this.msg = '';
    },
    run() {
      if (!Account.st || !Account.usable() || Account.st.needChoice) return Promise.resolve();
      if (this.running) { this.again = true; return this.running; }
      this.running = (async () => {
        this.setState('busy');
        try {
          if (App.sample) await adoptIfRemote();
          else applyPulled(await pullDocs(false));
          await pushPending();
          if (!Account.st) return;
          Account.st.lastOk = Date.now();
          Account.save();
          this.setState('ok');
          if (!this.firstDone) {
            this.firstDone = true;
            // 前からのデータを今日からログインボーナスにし、ToDoに初期のプロジェクトとラベルを足す。
            // 最新の記録を受け取ってから行う（古いデータで上書きしない）
            const login = ensureLoginMode();
            const starter = ensureTodoStarter();
            if (login || starter) render();
            if (login) bonusToast();
          }
        } catch (e) {
          this.fail(e);
        } finally {
          this.running = null;
          if (this.again) { this.again = false; this.soon(400); }
        }
      })();
      return this.running;
    },
    fail(e) {
      const code = e && e.code;
      if (code === 'SIGNED_OUT') return;
      if (code === 'NETWORK') { this.setState('offline'); return; }
      if (['TOKEN_EXPIRED', 'INVALID_REFRESH_TOKEN', 'USER_DISABLED', 'USER_NOT_FOUND', 'INVALID_ID_TOKEN', 'PROJECT_NUMBER_MISMATCH'].indexOf(code) >= 0) {
        Account.end();
        Account.expired = true;
        this.stop();
        render();
        refreshAccountUi();
        return;
      }
      this.setState('error', e && e.status === 403 ? '権限がありません' : String((e && e.message) || 'エラー').slice(0, 60));
    },
  };

  /** 受け取った変更を手元に反映する。まだ送っていない手元の変更がある文書は、手元を優先する */
  function applyPulled(docs) {
    const st = Account.st;
    let changed = false;
    let reset = false;
    for (const d of docs) {
      const prev = st.seen[d.id];
      if (prev && prev[0] === d.ut) continue; // 受け取り済み
      noteSeen([d]);
      if (d.by === st.device) continue; // この端末が書いたもの
      const k = Cloud.keyOf(d.id);
      if (!k) continue;
      if (k.indexOf('l-') === 0 && !d.del) {
        let body;
        try { body = JSON.parse(d.json); } catch (e) { continue; }
        const mk = k.slice(2);
        const merged = mergeLogins(App.data.logins[mk], body);
        if (merged.days.length > normalizeLogins(body).days.length) { st.pending[d.id] = 'put'; Sync.ver[d.id] = (Sync.ver[d.id] || 0) + 1; } // こちらにしかない日を送り返す
        if (merged.days.length !== ((App.data.logins[mk] && App.data.logins[mk].days.length) || 0)) changed = true;
        App.data.logins[mk] = merged;
        continue;
      }
      if (st.pending[d.id]) continue;
      if (d.del) {
        if (k === 'core') { reset = true; continue; }
        if (k === 'todo') App.data.todo = E.emptyTodo();
        else if (k.indexOf('c-') === 0) delete App.data.comps[k.slice(2)];
        else if (k.indexOf('l-') === 0) delete App.data.logins[k.slice(2)];
        else delete App.data.months[k];
        changed = true;
        continue;
      }
      let body;
      try { body = JSON.parse(d.json); } catch (e) { continue; }
      if (k === 'core') {
        const core = normalizeCore(body);
        if (!core) continue;
        App.data.core = core;
      } else if (k === 'todo') App.data.todo = normalizeTodo(body);
      else if (k.indexOf('c-') === 0) App.data.comps[k.slice(2)] = normalizeComps(body);
      else App.data.months[k] = normalizeMonth(body);
      changed = true;
    }
    for (const d of docs) if (tsKey(d.at) > tsKey(st.lastSeen)) st.lastSeen = d.at;
    Account.save();
    if (reset) {
      st.pending = {};
      Account.save();
      Store.clear().catch(() => { /* 無視 */ });
      enterSample();
      closeAllSheets();
      render();
      toast('ほかの端末でデータが消去されました');
      return;
    }
    if (changed) {
      App.rev++;
      Store.markDirty('core', true); // 手元に保存（送り返さない）
      render();
      refreshSheets();
      Notify.soon();
    }
  }
  /** 手元がサンプルのとき：アカウントに記録があればそれを使う */
  async function adoptIfRemote() {
    const st = Account.st;
    const docs = await pullDocs(true);
    noteSeen(docs);
    if (st.pending.core === 'del') return; // この端末で消去したところ
    const data = dataFromRemote(docs.filter((d) => !st.pending[d.id]));
    if (!data) return;
    useData(data);
    toast('アカウントの記録を読み込みました');
  }
  function useData(data) {
    App.data = data;
    App.sample = false;
    App.sync = { state: 'idle' };
    App.ui.viewDate = null;
    App.rev++;
    Store.markDirty('core', true);
    render();
    refreshSheets();
    Notify.soon();
    claimLogin(); // この端末で開いた今日の分
  }
  async function pushPending() {
    const st = Account.st;
    if (!st) return;
    if (App.sample) for (const id of Object.keys(st.pending)) if (st.pending[id] !== 'del') delete st.pending[id];
    const ids = Object.keys(st.pending);
    for (let i = 0; i < ids.length; i += 100) {
      const chunk = ids.slice(i, i + 100);
      const ver = chunk.map((id) => Sync.ver[id] || 0);
      const ops = chunk.map((id) => st.pending[id]);
      const r = await dbPost(':commit', { writes: chunk.map((id, j) => docWrite(st.uid, id, ops[j])) });
      if (!Account.st) return;
      const results = (r && r.writeResults) || [];
      chunk.forEach((id, j) => {
        const wr = results[j] || {};
        st.seen[id] = [wr.updateTime || (r && r.commitTime) || '', ops[j] === 'del' ? 1 : 0];
        if ((Sync.ver[id] || 0) === ver[j] && st.pending[id] === ops[j]) delete st.pending[id];
      });
      Account.save();
    }
  }

  /** Googleでログインしたあと。戻り値：'uploaded' | 'downloaded' | 'empty' | 'choose' | 'later' */
  async function signInGoogle(tok) {
    const r = await googleAuth(tok);
    Account.begin(r, r.email || tokenClaims(tok.idToken).email || '');
    return firstSync();
  }
  /** ログインした直後：アカウントとこの端末のどちらに記録があるかで、受け取る・送る・選んでもらう */
  async function firstSync() {
    const st = Account.st;
    Sync.setState('busy');
    try {
      const docs = await pullDocs(true);
      noteSeen(docs);
      const remote = dataFromRemote(docs);
      let result;
      if (!remote) {
        if (!App.sample) {
          for (const k of allKeys()) st.pending[Cloud.docId(k)] = 'put';
          const keep = new Set(allKeys().map((k) => Cloud.docId(k)));
          for (const id of liveIds()) if (!keep.has(id)) st.pending[id] = 'del';
          result = 'uploaded';
        } else result = 'empty';
      } else if (!hasOwnData()) {
        useData(remote);
        result = 'downloaded';
      } else {
        st.needChoice = true;
        Sync.choice = { remote };
        result = 'choose';
      }
      Account.save();
      Sync.state = 'ok';
      Sync.start();
      return result;
    } catch (e) {
      Sync.fail(e);
      Sync.start();
      return 'later';
    }
  }
  async function chooseRemote() {
    const st = Account.st;
    if (!st) return;
    let remote = Sync.choice && Sync.choice.remote;
    if (!remote) { const docs = await pullDocs(true); noteSeen(docs); remote = dataFromRemote(docs); }
    st.needChoice = false;
    st.pending = {};
    Sync.choice = null;
    Account.save();
    if (remote) useData(remote);
    Sync.run();
  }
  function chooseLocal() {
    const st = Account.st;
    if (!st || !App.data || App.sample) return;
    st.needChoice = false;
    Sync.choice = null;
    for (const k of allKeys()) st.pending[Cloud.docId(k)] = 'put';
    const keep = new Set(allKeys().map((k) => Cloud.docId(k)));
    for (const id of liveIds()) if (!keep.has(id)) st.pending[id] = 'del';
    Account.save();
    Sync.run();
  }
  /** アカウントの削除：直前にGoogleで本人確認した結果（fresh）を使い、記録を消してからアカウントを消す */
  async function deleteAccount(fresh) {
    const st = Account.st;
    Account.idToken = fresh.idToken;
    Account.idExp = Date.now() + (Number(fresh.expiresIn || 3600) - 300) * 1000;
    const docs = await pullDocs(true);
    for (let i = 0; i < docs.length; i += 100) {
      await dbPost(':commit', { writes: docs.slice(i, i + 100).map((d) => ({ delete: FIRE_NAME + '/users/' + st.uid + '/docs/' + d.id })) });
    }
    await authPost('delete', { idToken: fresh.idToken });
    Sync.stop();
    Account.end();
    Google.signOut();
  }

  const AUTH_MSG = {
    INVALID_IDP_RESPONSE: 'Googleでのログインを確認できませんでした。もう一度お試しください。',
    GOOGLE_NO_TOKEN: 'Googleからログインの情報を受け取れませんでした。もう一度お試しください。',
    GOOGLE_UNAVAILABLE: 'Googleのログインを準備できませんでした。インターネットにつながっているか確認して、開き直してください。',
    WRONG_ACCOUNT: 'ログイン中とは別のGoogleアカウントです。同じアカウントを選んでください。',
    NEED_CONFIRMATION: 'このメールアドレスは別の方法で登録されています。',
    CREDENTIAL_TOO_OLD_LOGIN_AGAIN: '確認してから時間がたちました。もう一度Googleで確認してください。',
    TOO_MANY_ATTEMPTS_TRY_LATER: '試した回数が多すぎます。しばらく待ってからやり直してください。',

  };
  const authMessage = (e) => AUTH_MSG[e && e.code] || 'うまくいきませんでした（' + String((e && e.message) || 'エラー').slice(0, 60) + '）。';

  // ---- 画面 ----
  function syncStatusText() {
    const st = Account.st;
    if (!st) return '';
    if (st.needChoice) return 'アカウントの記録と、この端末の記録のどちらを使うか選んでください。';
    if (Sync.state === 'busy') return '同期しています…';
    if (Sync.state === 'offline') return 'オフラインです。つながったら自動で同期します。';
    if (Sync.state === 'error') return '同期できませんでした（' + esc(Sync.msg) + '）。自動でやり直します。';
    const n = Object.keys(st.pending).length;
    if (n) return 'まだ送っていない変更があります。';

  /** ログイン・ログアウトのあと：開いている設定画面を書き直す（保存先の説明も変わるため） */

  function syncNotice() {

    if (Account.st && Account.st.needChoice) return notice('warn', 'アカウントの記録と、この端末の記録のどちらを使うか選んでください。', '<button class="btn-s" data-act="acctChoose">選ぶ</button>');

  // Googleのボタン：PCでは公式ボタンを mount で描き、iPhoneでは押したときにネイティブの画面を出す
  const googleButtonHtml = () => '<div class="g-wrap">' + (Native.on
    ? '<button type="button" class="btn g-native" data-act="googleNative">Googleでログイン</button>'
    : '<div class="g-web" id="g-btn"><span class="hint">Googleのボタンを読み込んでいます…</span></div>') + '</div>' +
    '<p class="hint g-busy" id="ac-busy" aria-live="polite"></p><p class="hint bad" id="ac-err" role="alert"></p>';
  function mountGoogle(el, sh) {
    if (Native.on) return;
    const box = el.querySelector('#g-btn');
    if (box) Google.button(box, { ok: (tok) => googleDone(sh, tok), fail: (e) => googleFail(sh, e) });
  }
  function googleBusy(sh, msg) {
    const layer = document.getElementById(sh.id);
    if (!layer) return;
    const b = layer.querySelector('#ac-busy');
    if (b) b.textContent = msg || '';
    const w = layer.querySelector('.g-wrap');
    if (w) w.classList.toggle('busy', !!msg);
    const err = layer.querySelector('#ac-err');
    if (err && msg) err.textContent = '';
  }
  function googleFail(sh, e) {
    googleBusy(sh, '');
    if (isCancel(e)) return; // 自分で閉じたときは何も出さない
    const err = document.querySelector('#' + sh.id + ' #ac-err');
    if (err) err.textContent = authMessage(e);
  }
  /** Google から ID トークンを受け取ったあと：ログイン、または削除の前の本人確認 */
  async function googleDone(sh, tok) {
    if (App.sheets.indexOf(sh) < 0) return;
    if (sh.type === 'acctDelete') {
      googleBusy(sh, '確認しています…');
      try {
        const st = Account.st;
        const mail = String(tokenClaims(tok.idToken).email || '').toLowerCase();
        if (!st || !mail || mail !== String(st.email || '').toLowerCase()) throw gErr('WRONG_ACCOUNT'); // 別のアカウントを作ってしまわないよう、先に確かめる
        const r = await googleAuth(tok);
        if (r.localId !== st.uid) throw gErr('WRONG_ACCOUNT');
        sh.params.fresh = r;
        fillSheet(sh);
      } catch (e) {
        googleFail(sh, e);
      }
      return;
    }
    googleBusy(sh, 'ログインしています…');
    try {
      const result = await signInGoogle(tok);
      closeSheet(sh.id);
      render();
      refreshSettings();
      if (result === 'choose') openSheet('syncChoice', {});
      else if (result === 'downloaded') toast('ログインしました。アカウントの記録を読み込みました');
      else if (result === 'uploaded') toast('ログインしました。この端末の記録をアカウントに送ります');
      else toast('ログインしました');
    } catch (e) {
      googleFail(sh, e);
    }
  }

      el.disabled = true;
      el.textContent = '削除しています…';
      try {
        await deleteAccount(sh.params.fresh);
        closeAllSheets();
        render();
        toast('アカウントを削除しました。この端末の記録は残っています');
      } catch (e) {
        if (e.code === 'CREDENTIAL_TOO_OLD_LOGIN_AGAIN' || e.code === 'INVALID_ID_TOKEN') sh.params.fresh = null; // 確認からやり直す
        fillSheet(sh);
        const err = document.querySelector('#' + sh.id + ' #ac-err');
        if (err) err.textContent = authMessage(e);
      }
    },
  };

  const ACCOUNT_FORMS = {}; // パスワードの入力欄はもうない（Googleでログイン）


  // バックアップ
  function exportJson() {
    return JSON.stringify({ app: 'habit-kcal', v: 2, exportedAt: new Date().toISOString(), core: App.data.core, months: App.data.months, todo: App.data.todo, comps: App.data.comps, logins: App.data.logins });
  }
  function parseBackup(text) {
    let o;
    try { o = JSON.parse(text); } catch (e) { return null; }
    if (!o || o.app !== 'habit-kcal' || !o.months || typeof o.months !== 'object') return null;
    const core = normalizeCore(clone(o.core));
    if (!core) return null;
    const months = {};
    for (const k of Object.keys(o.months)) if (/^\d{4}-\d{2}$/.test(k)) months[k] = normalizeMonth(o.months[k]);
    const comps = {};
    for (const k of Object.keys(o.comps || {})) if (/^\d{4}-\d{2}$/.test(k)) comps[k] = normalizeComps(o.comps[k]);
    const logins = {};
    for (const k of Object.keys(o.logins || {})) if (/^\d{4}-\d{2}$/.test(k)) logins[k] = normalizeLogins(o.logins[k]);
    return { core, months, todo: normalizeTodo(o.todo ? clone(o.todo) : null), comps, logins };
  }
  function importText(text) {
    const data = parseBackup(text);
    if (!data) { toast('このアプリのバックアップとして読み込めませんでした'); return; }
    const n = data.core.habits.length;
    confirmDialog({
      title: 'バックアップから戻しますか？',
      body: '習慣' + n + '件・タスク' + data.todo.tasks.filter((t) => !t.parentId).length + '件・' + Object.keys(data.months).length + 'か月分の記録を読み込み、いまのデータと置き換えます。',
      ok: '置き換える',
      danger: true,
      onOk: async () => {
        App.data = data;
        App.sample = false;
        App.sync = { state: 'idle' };
        App.ui.viewDate = null;
        App.rev++;
        closeAllSheets();
        render();
        await pruneCloud();
        await Store.writeAll();
        toast('バックアップから戻しました');
        if (isDemo()) runSync(true);
      },
    });
  }

  // ===================== ToDo（Todoist型＋完了報酬） =====================
  // app.js の中に組み込まれる（同じスコープの App, E, esc, fmt などを使う）
  const TCOLORS = { ai: '#3f63c5', shu: '#d24a32', kin: '#d99a2b', midori: '#3f8f5b', murasaki: '#7a5bb5', momo: '#d0587e', aomidori: '#2b8a8a', hai: '#8a92a6' };
  const TCOLOR_NAMES = { ai: '藍', shu: '朱', kin: '金', midori: '緑', murasaki: '紫', momo: '桃', aomidori: '青緑', hai: '灰' };
  const IC_SEARCH = svg('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>');
  const byOrder = (a, b) => (a.order || 0) - (b.order || 0);

  function todo() { return App.data.todo; }
  function taskById(id) { return App.data.todo.tasks.find((t) => t.id === id); }
  function projectById(id) { return id ? App.data.todo.projects.find((p) => p.id === id) : null; }
  function sectionById(id) { return id ? App.data.todo.sections.find((s) => s.id === id) : null; }
  function labelById(id) { return App.data.todo.labels.find((l) => l.id === id); }
  function subtasksOf(id) { return App.data.todo.tasks.filter((t) => t.parentId === id).sort(byOrder); }
  function projColor(p) { return TCOLORS[(p && p.color) || 'hai'] || TCOLORS.hai; }
  function projectsOf(archived) { return todo().projects.filter((p) => !!p.archived === !!archived).sort(byOrder); }
  function isArchivedProject(pid) { const p = projectById(pid); return !!(p && p.archived); }
  /** 一覧に出す未完了のタスク（アーカイブしたプロジェクトのものは出さない） */
  function liveTasks() { return todo().tasks.filter((t) => !t.done && !isArchivedProject(t.projectId)); }
  function topLive() { return liveTasks().filter((t) => !t.parentId); }
  function findComp(id) {
    for (const k of Object.keys(App.data.comps)) {
      const c = App.data.comps[k].completions.find((x) => x.id === id);
      if (c) return c;
    }
    return null;
  }
  function allComps() {
    return flat().completions.slice().sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : (b.ts || 0) - (a.ts || 0)));
  }
  function shortWd(s) { const d = E.parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + E.WD_NAMES[d.getDay()] + '）'; }
  function mdLabel(s) {
    const d = E.parseYmd(s);
    return (d.getFullYear() !== E.parseYmd(today()).getFullYear() ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  /** Todoistと同じ日付の言い方と色：今日・明日・1週間以内は曜日・その先は月日。過ぎたものは赤 */
  function dayInfo(date, t) {
    const n = E.diffDays(t, date);
    const label = n === 0 ? '今日' : n === 1 ? '明日' : n === -1 ? '昨日' : n > 1 && n < 7 ? E.WD_NAMES[E.weekday(date)] + '曜日' : mdLabel(date);
    const cls = n < 0 ? 'over' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : n < 7 ? 'week' : 'later';
    return { label, cls, n };
  }
  /** 日付の見出し（Todoistと同じ「11月25日 ‧ 今日 ‧ 水曜日」） */
  function dayHeadText(d, t) {
    const n = E.diffDays(t, d);
    return mdLabel(d) + (n === 0 ? ' ‧ 今日' : n === 1 ? ' ‧ 明日' : '') + ' ‧ ' + E.WD_NAMES[E.weekday(d)] + '曜日';
  }
  function dueLabel(due, t) {
    let s = dayInfo(due.date, t).label;
    if (due.time) s += ' ' + hmLabel(due.time);
    return s;
  }
  function remLabel(rem, t) {
    const p = rem.split('T');
    return (p[0] === t ? '' : shortDate(p[0]) + ' ') + hmLabel(p[1] || '09:00');
  }
  function nowLocal() { return E.ymd(new Date()) + 'T' + nowHM(); }
  /** 今日の一覧：予定日か期限が今日以前のもの */
  function todayLists(t) {
    const key = (x) => (x.due ? x.due.date : x.deadline);
    const live = liveTasks().filter((x) => (x.due && x.due.date <= t) || (!x.due && x.deadline && x.deadline <= t));
    return {
      overdue: live.filter((x) => key(x) < t).sort(E.taskSort),
      today: live.filter((x) => key(x) === t).sort(E.taskSort),
    };
  }
  function todayCount(t) { const l = todayLists(t); return l.overdue.length + l.today.length; }

  // 行に並べる小さなアイコン（Todoistと同じ並び：日付・期限・リマインダー・サブタスク・ラベル、右にプロジェクト）
  const MI = {
    cal: svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="6.5"/><line x1="16" y1="3" x2="16" y2="6.5"/>', 'mi'),
    rep: svg('<polyline points="17 2.5 20.5 6 17 9.5"/><path d="M4 11.5v-1A4.5 4.5 0 0 1 8.5 6h12"/><polyline points="7 21.5 3.5 18 7 14.5"/><path d="M20 12.5v1a4.5 4.5 0 0 1-4.5 4.5h-12"/>', 'mi'),
    alarm: svg('<circle cx="12" cy="13" r="7.5"/><polyline points="12 9.5 12 13 14.5 14.5"/><line x1="4" y1="4.5" x2="6.5" y2="2.5"/><line x1="20" y1="4.5" x2="17.5" y2="2.5"/>', 'mi'),
    tag: svg('<path d="M3.5 12.6V4.5a1 1 0 0 1 1-1h8.1a1 1 0 0 1 .7.3l7.4 7.4a1 1 0 0 1 0 1.4l-8.1 8.1a1 1 0 0 1-1.4 0l-7.4-7.4a1 1 0 0 1-.3-.7z"/><circle cx="8.3" cy="8.3" r="1.4"/>', 'mi'),
    target: svg('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/>', 'mi'),
    sub: svg('<path d="M6 4v10a3 3 0 0 0 3 3h9"/><polyline points="15 14 18 17 15 20"/>', 'mi'),
    inbox: svg('<path d="M3.5 13.5 6 5.5a1.5 1.5 0 0 1 1.4-1h9.2a1.5 1.5 0 0 1 1.4 1l2.5 8v5a1.5 1.5 0 0 1-1.5 1.5h-13a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M3.5 13.5h5l1 2.5h5l1-2.5h5"/>', 'mi'),
    hash: svg('<line x1="9.5" y1="4" x2="7.5" y2="20"/><line x1="16.5" y1="4" x2="14.5" y2="20"/><line x1="4.5" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="19.5" y2="15"/>', 'mi'),
    note: svg('<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/>', 'mi'),
    kcal: svg('<path d="M12 3c1.5 3.5 6 5.5 6 10.5a6 6 0 0 1-12 0c0-2.3 1-4 2.3-5.2.2 1.7 1 2.9 2.2 3.4C10.3 9 10.6 5.8 12 3z"/>', 'mi'),
    up: svg('<line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/>'),
    upcoming: svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="6.5"/><line x1="16" y1="3" x2="16" y2="6.5"/><circle cx="8.5" cy="13.5" r=".6"/><circle cx="12" cy="13.5" r=".6"/><circle cx="15.5" cy="13.5" r=".6"/><circle cx="8.5" cy="17" r=".6"/><circle cx="12" cy="17" r=".6"/>'),
  };
  /** 「今日」のアイコン：カレンダーの中に今日の日にち（Todoistと同じ） */
  function todayIcon(t) {
    return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><line x1="8" y1="3" x2="8" y2="6.5"/><line x1="16" y1="3" x2="16" y2="6.5"/>' +
      '<text x="12" y="17.6" text-anchor="middle" font-size="9" font-weight="700" style="fill:currentColor;stroke:none">' + E.parseYmd(t).getDate() + '</text></svg>';
  }
  const firstLine = (s) => String(s || '').split('\n').map((x) => x.trim()).filter(Boolean)[0] || '';
  function taskRow(task, o) {
    o = o || {};
    const t = today();
    const subs = task.parentId ? [] : subtasksOf(task.id);
    const meta = [];
    if (task.due && (o.showDate !== false || task.due.time || task.repeat)) {
      const di = dayInfo(task.due.date, t);
      const txt = o.showDate !== false ? dueLabel(task.due, t) : task.due.time ? hmLabel(task.due.time) : '';
      meta.push('<span class="tm-due ' + di.cls + '">' + (txt ? MI.cal + txt : '') + (task.repeat ? MI.rep : '') + '</span>');
    }
    if (task.deadline) meta.push('<span class="tm-dl' + (task.deadline <= E.addDays(t, 1) ? ' soon' : '') + '">' + MI.target + dayInfo(task.deadline, t).label + '</span>');
    if (task.reminder) meta.push('<span class="tm-rem">' + MI.alarm + remLabel(task.reminder, t) + '</span>');
    if (subs.length) meta.push('<span class="tm-sub">' + MI.sub + subs.filter((s) => s.done).length + '/' + subs.length + '</span>');
    for (const lid of task.labels || []) {
      const l = labelById(lid);
      if (l) meta.push('<span class="tm-label" style="color:' + (TCOLORS[l.color] || TCOLORS.hai) + '">' + MI.tag + esc(l.name) + '</span>');
    }
    if (task.parentId && o.showParent) {
      const par = taskById(task.parentId);
      if (par) meta.push('<span class="tm-parent">↳ ' + esc(par.title) + '</span>');
    }
    if (o.showProject) {
      const p = projectById(task.projectId);
      const sec = p ? sectionById(task.sectionId) : null;
      meta.push('<span class="tm-proj">' + esc(p ? p.name + (sec ? ' / ' + sec.name : '') : 'Inbox') +
        (p ? '<span class="hash" style="color:' + projColor(p) + '">#</span>' : MI.inbox) + '</span>');
    }
    const desc = firstLine(task.note);
    const kcal = !task.parentId && task.reward > 0 ? '<span class="task-kcal">+' + fmt(task.reward) + '</span>' : '<span></span>';
    const nested = o.nested && subs.some((s) => !s.done)
      ? '<ul class="subtask-list">' + subs.filter((s) => !s.done).map((s) => taskRow(s, { showDate: true })).join('') + '</ul>' : '';
    return '<li class="task-row' + (o.sortable ? ' sortable-item' : '') + (task.parentId ? ' is-sub' : '') + '" data-task-row="' + task.id + '" data-id="' + task.id + '">' +
      '<button class="tcheck" data-act="taskDone" data-id="' + task.id + '" aria-label="「' + esc(task.title) + '」を完了にする"></button>' +
      '<button class="task-main" data-act="taskOpen" data-id="' + task.id + '"><span class="task-title">' + esc(task.title) + '</span>' +
      (desc ? '<span class="task-desc">' + esc(desc) + '</span>' : '') +
      (meta.length ? '<span class="task-meta">' + meta.join('') + '</span>' : '') + '</button>' + kcal +
      (o.sortable ? '<button class="grip" data-grip="1" aria-label="「' + esc(task.title) + '」を並び替え。上下の矢印キーでも移動できます">' + IC.grip + '</button>' : '') +
      nested + '</li>';

  function compRow(cp) {
    const p = projectById(cp.projectId);
    return '<li class="task-row done-row"><span class="tcheck done" aria-hidden="true"></span>' +

      (cp.ts ? '<span class="tm-time">' + clockLabel(cp.ts) + '</span>' : '') +
      (cp.recurring ? '<span class="tm-due later">' + MI.rep + '繰り返し</span>' : '') +
      '<span class="tm-proj">' + esc(p ? p.name : 'Inbox') + (p ? '<span class="hash" style="color:' + projColor(p) + '">#</span>' : MI.inbox) + '</span>' +

  }
  const taskList = (items, o, attrs) => '<ul class="task-list"' + (attrs || '') + '>' + items.map((x) => taskRow(x, o)).join('') + '</ul>';
  const secHead = (title, side) => '<div class="tsec-head"><h3>' + title + '</h3>' + (side || '') + '</div>';
  /** 画面の見出し（Todoistのように大きな題名と、その下に件数） */
  const viewHead = (title, sub, side) => '<div class="tv-head"><div class="tv-text"><h2 class="tv-title">' + title + '</h2>' +
    (sub ? '<p class="tv-sub">' + sub + '</p>' : '') + '</div>' + (side || '') + '</div>';
  const countSub = (n) => (n ? IC.task + n + '件のタスク' : '');
  // 検索と完了済みは、どの画面からでも開けるよう、タブの右端に置く
  const viewTools = () => '<div class="ttools"><button class="icon-btn" data-act="todoSearch" aria-label="検索">' + IC_SEARCH + '</button>' +
    '<button class="icon-btn" data-act="todoTab" data-tab="done" aria-label="完了済みのタスク"' + (App.ui.todoTab === 'done' ? ' aria-current="page"' : '') + '>' + IC.task + '</button></div>';
  /** 「＋ タスクを追加」（一覧の終わりに置く。Todoistと同じ） */
  const addLine = (attrs) => '<button class="add-line" data-act="taskNew"' + (attrs || '') + '><span class="al-plus">' + IC.plus + '</span>タスクを追加</button>';

  // ----- ホームの切り替えとToDoカード -----
  function homeSwitch(L) {
    const seg = App.ui.homeSeg === 'todo' ? 'todo' : 'habit';
    return '<div class="home-switch" role="tablist" aria-label="習慣とToDoの切り替え">' +
      '<button role="tab" aria-selected="' + (seg === 'habit') + '" data-act="homeSeg" data-v="habit"><span>習慣</span><b>+' + fmt(L.Rh) + ' kcal</b></button>' +
      '<button role="tab" aria-selected="' + (seg === 'todo') + '" data-act="homeSeg" data-v="todo"><span>ToDo</span><b>+' + fmt(L.Rt) + ' kcal</b></button></div>';
  }
  function todoCard(c, d, t) {
    if (d !== t) return todoPastCard(c, d);
    const tab = App.ui.todoTab || 'inbox'; // 最初に開くのは Inbox
    const counts = { today: todayCount(t), inbox: topLive().filter((x) => !x.projectId).length };
    const tabs = [['inbox', 'Inbox', MI.inbox], ['today', '今日', todayIcon(t)], ['upcoming', '近日予定', MI.upcoming], ['projects', 'プロジェクト', MI.hash], ['labels', 'ラベル', MI.tag]];
    let body;

    else if (tab === 'upcoming') body = viewUpcoming(t);

    else if (tab === 'labels') body = App.ui.todoId ? viewLabel(App.ui.todoId) : viewLabels();

      tabs.map((x) => '<button role="tab" class="ttab" aria-selected="' + (tab === x[0]) + '" data-act="todoTab" data-tab="' + x[0] + '">' + x[2] + x[1] +
        (counts[x[0]] ? '<span>' + counts[x[0]] + '</span>' : '') + '</button>').join('') + '</div>' + viewTools() + '</div>' +
      '<div class="tbody">' + body + '</div></section>';
  }
  function todoPastCard(c, d) {
    const comps = c.completionsOn(d);
    const sum = comps.reduce((s, x) => s + (x.reward || 0), 0);
    return '<section class="card todo" aria-labelledby="h-todo-past"><div class="sec-head"><h2 id="h-todo-past">この日に完了したタスク</h2><span class="tsec-sub">+' + fmt(sum) + ' kcal</span></div>' +
      (comps.length ? '<ul class="task-list">' + comps.map(compRow).join('') + '</ul>' : '<p class="empty">この日に完了したタスクはありません。</p>') +

  function viewToday(c, t) {
    const l = todayLists(t);

    if (l.overdue.length) {
      h += secHead('期限切れ', '<button class="link-btn red" data-act="taskReschedule">日程を変更</button>') + taskList(l.overdue, { showProject: true, showParent: true });

  function viewInbox() {

  }
  function viewUpcoming(t) {
    const span = App.ui.todoUpDays || 14;
    const live = liveTasks();
    const dateOf = (x) => (x.due ? x.due.date : x.deadline);
    const dated = live.filter((x) => dateOf(x));
    const overdue = dated.filter((x) => dateOf(x) < t).sort(E.taskSort);

    for (let i = 0; i < span; i++) {
      const d = E.addDays(t, i);

      h += '<div class="tsec-head date"><h3>' + dayHeadText(d, t) + '</h3></div>';
      if (items.length) h += taskList(items, { showProject: true, showParent: true, showDate: false });

  /** 繰り返しの設定を作る。予定日 date が起点（毎週で曜日を選んでいなければ予定日の曜日、毎月・毎年は予定日の日付） */

    return {
      type: rtype,
      every: rtype === 'daily' || rtype === 'weekly' || rtype === 'monthly' ? Math.max(1, Math.min(30, every || 1)) : 1,
      days: rtype === 'weekly' ? days.sort((a, b) => a - b) : undefined,

  const lcolor = (l) => TCOLORS[l.color] || TCOLORS.hai;

  /** 選んでいる日付・時間・繰り返しを、ひと言で（「明日 17:30 ・ 毎日」） */

  function pickCalendar(p, t) {

  /** 日付を選んだ結果を、開いたところ（タスクの追加・タスクの画面・期限切れの日程変更）に反映する */
  function overdueTasks(t) {
    const key = (x) => (x.due ? x.due.date : x.deadline);

  function refreshTaskSheets() { App.sheets.filter((x) => x.type === 'taskEdit').forEach(fillSheet); }
  function pickApply(sh, close) {
    const p = sh.params;
    const g = p.target || {};
    const t0 = today();
    if (g.kind === 'quick') {
      const q = App.sheets.find((x) => x.id === g.sheet);
      if (q) { Object.assign(q.params.form, { date: p.date, time: p.time, rtype: p.rtype, every: p.every, rdays: p.rdays.slice() }); qaSync(q); }
    } else if (g.kind === 'task') {
      const t = taskById(g.id);
      if (t) {
        const date = p.date || (p.rtype || p.time ? t0 : '');
        t.due = date ? (p.time ? { date, time: p.time } : { date }) : null;
        if (!t.parentId) t.repeat = p.rtype && date ? buildRepeat(p.rtype, p.every, p.rdays, date) : null;
        commit(['todo']);
        refreshTaskSheets();
      }
    } else if (g.kind === 'deadline') {
      const t = taskById(g.id);
      if (t) { t.deadline = p.date || null; commit(['todo']); refreshTaskSheets(); }
    } else if (g.kind === 'overdue' && p.date) {
      const list = overdueTasks(t0);
      list.forEach((x) => { if (x.due) x.due.date = p.date; else x.deadline = p.date; });
      commit(['todo']);

  /** 題名と説明は、入力欄から離れたとき（と閉じるとき）に保存する */

    if (ls.length) h += '<h3 class="dv-h"><span>ラベル</span></h3><ul class="plist">' + ls.map((l) => '<li><button class="pl-row" data-act="labelOpen" data-id="' + l.id + '"><span class="lmark" style="color:' + (TCOLORS[l.color] || TCOLORS.hai) + '">@</span><span>' + esc(l.name) + '</span>' + IC.chev + '</button></li>').join('') + '</ul>';
    if (cs.length) h += '<h3 class="dv-h"><span>完了済み</span><span>' + cs.length + '件</span></h3><ul class="task-list">' + cs.map(compRow).join('') + '</ul>';
    return h || '<p class="empty">「' + esc(q) + '」に当てはまるものはありません。</p>';
  }
  function refreshSearch(sh) {
    const el = document.getElementById(sh.id);
    if (el) el.querySelector('#ts-res').innerHTML = searchResults(sh.params.q);
  }
  function toggleIn(list, v) { const i = list.indexOf(v); if (i >= 0) list.splice(i, 1); else list.push(v); }
  /** 完了の「+kcal」は行が消えても見えるよう、画面に固定して浮かべる */
  function flyAt(el, text) {
    if (reduceMotion() || !el) return;
    const r = el.getBoundingClientRect();
    const b = document.createElement('span');
    b.className = 'kcal-fly fixed';
    b.textContent = text;
    b.style.left = Math.max(8, r.right - 110) + 'px';
    b.style.top = Math.max(8, r.top + 4) + 'px';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1300);
  }

  // ----- 行の指の操作（Todoistと同じ）：右へスワイプで完了、左へスワイプで日付を選ぶ、長押しで並び替え -----
  const Gest = { row: null, x0: 0, y0: 0, dx: 0, mode: '', timer: 0, ev: null, suppress: false };
  function gestReset(animate) {
    clearTimeout(Gest.timer);
    const row = Gest.row;
    const held = Gest.mode === 'swipe';
    Gest.row = null;
    Gest.mode = '';
    if (!row) return;
    row.classList.remove('pressing');
    if (!row.classList.contains('swiping')) return;
    const done = () => {
      row.classList.remove('swiping', 'sw-done', 'sw-date', 'sw-ready', 'sw-back');
      row.style.removeProperty('--sx');
      // スワイプ中に止めていた描き直しを、ここで済ませる
      if (held) { dragging = false; render(); }
    };
    if (animate && !reduceMotion()) { row.classList.add('sw-back'); row.style.setProperty('--sx', '0px'); setTimeout(done, 200); } else done();
  }
  document.addEventListener('pointerdown', (ev) => {
    if (ev.pointerType === 'mouse' || Gest.row || dragging) return;
    const row = ev.target.closest('.task-row[data-task-row]');
    if (!row || ev.target.closest('.tcheck, [data-grip]')) return;
    Object.assign(Gest, { row, x0: ev.clientX, y0: ev.clientY, dx: 0, mode: 'wait', ev });
    if (row.classList.contains('sortable-item')) {
      row.classList.add('pressing');
      Gest.timer = setTimeout(() => {
        if (Gest.row !== row || Gest.mode !== 'wait') return;
        if (!row.isConnected) { gestReset(false); return; } // 描き直されていたら、やめる
        row.classList.remove('pressing');
        Gest.mode = 'drag';
        Gest.suppress = true; // 指を離したあとのタップでタスクを開かない
        const clear = () => setTimeout(() => { Gest.suppress = false; }, 400);
        window.addEventListener('pointerup', clear, { once: true });
        window.addEventListener('pointercancel', clear, { once: true });
        startDrag(Gest.ev, row);
        Gest.row = null;
      }, 450);
    }
  });
  document.addEventListener('pointermove', (ev) => {
    const row = Gest.row;
    if (!row) return;
    const dx = ev.clientX - Gest.x0;
    const dy = ev.clientY - Gest.y0;
    if (Gest.mode === 'wait') {
      if (!row.isConnected) { gestReset(false); return; }
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { gestReset(false); return; } // 縦はスクロール
      if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      clearTimeout(Gest.timer);
      row.classList.remove('pressing');
      Gest.mode = 'swipe';
      dragging = true; // スワイプ中は描き直さない（行が入れ替わらないように）
      row.classList.add('swiping');
    }
    if (Gest.mode !== 'swipe') return;
    const w = row.getBoundingClientRect().width;
    Gest.dx = Math.max(-w * 0.75, Math.min(w * 0.75, dx));
    row.style.setProperty('--sx', Gest.dx + 'px');
    row.classList.toggle('sw-done', Gest.dx > 0);
    row.classList.toggle('sw-date', Gest.dx < 0);
    row.classList.toggle('sw-ready', Math.abs(Gest.dx) > Math.min(110, w * 0.3));
  });
  function gestEnd() {
    const row = Gest.row;
    if (!row) return;
    if (Gest.mode !== 'swipe') { gestReset(false); return; }
    const ready = row.classList.contains('sw-ready');
    const dir = Gest.dx > 0 ? 'done' : 'date';
    Gest.suppress = true;
    setTimeout(() => { Gest.suppress = false; }, 400);
    const id = row.dataset.taskRow;
    gestReset(true);
    if (!ready) return;
    if (dir === 'done') completeWithFx(id, row.querySelector('.tcheck'), null);
    else TODO_ACTIONS.teDate({ dataset: { id } });
  }
  document.addEventListener('pointerup', gestEnd);
  document.addEventListener('pointercancel', () => gestReset(true));
  // スワイプ・長押しのあとに来るタップは、タスクを開かない
  document.addEventListener('click', (ev) => {
    if (!Gest.suppress) return;

    if (ev.target.closest && ev.target.closest('.task-row')) { ev.preventDefault(); ev.stopPropagation(); }

  // ----- ToDoの操作 -----
  const TodoAct = {
    add(f) {
      const list = todo().tasks;
      const order = list.filter((x) => (x.projectId || null) === (f.projectId || null) && (x.sectionId || null) === (f.sectionId || null) && !x.parentId)
        .reduce((m, x) => Math.max(m, x.order || 0), -1) + 1;
      const t = Object.assign({ id: newId('t'), title: '', note: '', projectId: null, sectionId: null, parentId: null, order, labels: [], due: null, deadline: null, repeat: null, reminder: null, reward: todo().settings.defaultReward, done: false, createdAt: Date.now() }, f);
      list.push(t);
      commit(['todo']);
      return t;
    },
    complete(id, autoIds) {
      const doneOn = today();
      const res = E.completeTask(App.data.todo, id, doneOn, Date.now(), newId('c'));
      if (!res) return null;
      const keys = ['todo'];
      if (res.comp) {
        const auto = autoIds || [];
        if (auto.length && res.comp.snapshot) res.comp.snapshot.subtasks.forEach((s) => { if (auto.indexOf(s.id) >= 0) { s.done = false; delete s.doneAt; } });
        if (auto.length && res.comp.prevSubs) res.comp.prevSubs.forEach((s) => { if (auto.indexOf(s.id) >= 0) s.done = false; });
        const k = E.monthKey(doneOn);
        (App.data.comps[k] || (App.data.comps[k] = { completions: [] })).completions.push(res.comp);
        keys.push('c-' + k);
      }
      commit(keys);
      return res;
    },
    uncomplete(compId) {
      for (const k of Object.keys(App.data.comps)) {
        const list = App.data.comps[k].completions;
        const i = list.findIndex((c) => c.id === compId);
        if (i < 0) continue;
        const comp = list.splice(i, 1)[0];
        E.uncompleteTask(App.data.todo, comp);
        commit(['todo', 'c-' + k]);
        return comp;
      }
      return null;
    },
    moveComp(compId, date) {
      for (const k of Object.keys(App.data.comps)) {
        const list = App.data.comps[k].completions;
        const i = list.findIndex((c) => c.id === compId);
        if (i < 0) continue;
        const comp = list[i];
        const k2 = E.monthKey(date);
        comp.date = date;
        if (k2 === k) { commit(['c-' + k]); return; }
        list.splice(i, 1);
        (App.data.comps[k2] || (App.data.comps[k2] = { completions: [] })).completions.push(comp);
        commit(['c-' + k, 'c-' + k2]);
        return;
      }
    },
    remove(id) {
      const removed = todo().tasks.filter((x) => x.id === id || x.parentId === id);
      todo().tasks = todo().tasks.filter((x) => x.id !== id && x.parentId !== id);
      commit(['todo']);
      return removed;
    },
    restore(items) {
      for (const x of items) if (!todo().tasks.some((y) => y.id === x.id)) todo().tasks.push(x);
      commit(['todo']);
    },
    reorder(ids) {
      ids.forEach((id, i) => { const t = taskById(id); if (t) t.order = i; });
      commit(['todo']);
    },
  };

  function afterTaskSheetChange(sh) { if (sh) fillSheet(sh); }
  function completeWithFx(id, el, sh) {
    const t = taskById(id);
    if (!t) return;
    const open = t.parentId ? [] : subtasksOf(id).filter((s) => !s.done);
    const run = (autoIds) => {
      const row = el ? el.closest('.task-row, .te-head, .sub-edit li') : null;
      if (row && !reduceMotion()) {
        row.classList.add('is-checking');
        if (!t.parentId && t.reward > 0) flyAt(row, '+' + fmt(t.reward) + ' kcal');
      }
      const go = () => {
        const res = TodoAct.complete(id, autoIds);
        if (!res) return;
        if (sh && sh.type === 'taskEdit' && sh.params.id === id && res.kind !== 'sub') closeSheet(sh.id);
        else if (sh && sh.type === 'taskEdit') afterTaskSheetChange(sh);
        if (res.kind === 'sub') { toast('サブタスクを完了しました'); return; }
        const cid = res.comp.id;
        toast('「' + t.title + '」を完了' + (res.comp.reward ? ' +' + fmt(res.comp.reward) + ' kcal' : '') + (res.kind === 'recurring' ? '（次は ' + shortDate(res.task.due.date) + '）' : ''),
          { label: '元に戻す', fn: () => TodoAct.uncomplete(cid) });
      };
      if (row && !reduceMotion()) setTimeout(go, 380); else go();
    };
    if (open.length) {
      confirmDialog({
        title: 'サブタスクもまとめて完了にしますか？',
        body: '未完了のサブタスクが' + open.length + '件あります。報酬は、サブタスクをすべて完了してから親タスクを完了したときにもらえます。まとめて完了にすると +' + fmt(t.reward || 0) + ' kcal を受け取れます。',
        ok: 'まとめて完了',
        onOk: () => {
          open.forEach((s) => { s.done = true; s.doneAt = Date.now(); });
          run(open.map((s) => s.id));
        },
      });
      return;
    }
    run([]);
  }

  const TODO_ACTIONS = {
    homeSeg(el) { App.ui.homeSeg = el.dataset.v; render(); },
    todoTab(el) { App.ui.todoTab = el.dataset.tab; App.ui.todoId = null; render(); },
    todoBack() { App.ui.todoId = null; render(); },
    todoUpMore() { App.ui.todoUpDays = (App.ui.todoUpDays || 14) + 14; render(); },
    todoDoneMore() { App.ui.todoDoneLimit = (App.ui.todoDoneLimit || 50) + 50; render(); },
    todoDoneToggle() { App.ui.todoDoneOpen = !App.ui.todoDoneOpen; render(); },
    todoSearch() { openSheet('todoSearch', {}); },
    taskNew(el) {
      const p = {};
      if (el.dataset.date !== undefined) p.date = el.dataset.date;
      if (el.dataset.project) p.project = el.dataset.project;
      if (el.dataset.section) p.section = el.dataset.section;
      openSheet('taskNew', p);
    },
    taskOpen(el) {
      // サブタスクを開くときは、いまのタスクの画面の題名・説明を保存してから
      const cur = App.sheets.find((x) => x.type === 'taskEdit');
      if (cur) saveTitleNote(cur);
      openSheet('taskEdit', { id: el.dataset.id });
    },
    taskDone(el, sh) { completeWithFx(el.dataset.id, el, sh); },
    taskReschedule() {
      if (!overdueTasks(today()).length) return;
      openSheet('datePick', { title: '日程を変更', target: { kind: 'overdue' }, kind: 'overdue', date: '', time: '', rtype: '', every: 1, rdays: [] });
    },
    taskDelete(el, sh) {
      const t = taskById(el.dataset.id);
      if (!t) return;
      confirmDialog({
        title: '「' + t.title + '」を削除しますか？',
        body: (t.parentId ? '' : 'サブタスクも一緒に削除されます。') + 'これまでに獲得した報酬はそのまま残ります。',
        ok: '削除する',
        danger: true,
        onOk: () => {
          if (sh) closeSheet(sh.id);
          const removed = TodoAct.remove(t.id);
          toast('削除しました', { label: '元に戻す', fn: () => TodoAct.restore(removed) });
        },
      });
    },
    // タスクの追加：チップから日付・ラベル・報酬・プロジェクトを選ぶ
    qaDate(el, sh) {
      const f = sh.params.form;
      backToTitle(openSheet('datePick', { target: { kind: 'quick', sheet: sh.id }, kind: 'due', date: f.date, time: f.time || '', rtype: f.rtype, every: f.every, rdays: f.rdays.slice(), withTime: true, withRepeat: true, allowNone: true }), sh);
    },
    qaDateClear(el, sh) { Object.assign(sh.params.form, { date: '', time: '', rtype: '', every: 1, rdays: [] }); qaSync(sh); },
    qaLabels(el, sh) { backToTitle(openSheet('labelPick', { target: { kind: 'quick', sheet: sh.id } }), sh); },
    qaLabelsClear(el, sh) { sh.params.form.labels = []; qaSync(sh); },
    qaReward(el, sh) { backToTitle(openSheet('rewardPick', { target: { kind: 'quick', sheet: sh.id }, value: sh.params.form.reward }), sh); },
    qaProj(el, sh) { backToTitle(openSheet('projPick', { target: { kind: 'quick', sheet: sh.id }, cur: sh.params.form.proj }), sh); },
    // 日付を選ぶ画面
    dpSet(el, sh) {
      const p = sh.params;
      p.date = el.dataset.v;
      if (!p.date) { p.time = ''; p.rtype = ''; }
      pickApply(sh, true);
    },
    dpMonth(el, sh) {
      const p = sh.params;
      const ym = (p.view || (p.date || today()).slice(0, 7)).split('-').map(Number);
      const d = new Date(ym[0], ym[1] - 1 + Number(el.dataset.d), 1);
      p.view = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      fillSheet(sh);
    },
    dpTimeClear(el, sh) { sh.params.time = ''; pickApply(sh, false); },
    dpRepToggle(el, sh) { sh.params.repOpen = !sh.params.repOpen; fillSheet(sh); },
    dpRep(el, sh) {
      const p = sh.params;
      const v = el.dataset.v;
      if (!p.date && v) p.date = today();
      Object.assign(p, { rtype: v, every: 1, rdays: v === 'weekly' ? [E.weekday(p.date)] : [] });
      pickApply(sh, true);
    },
    dpRepCustom(el, sh) {
      const p = sh.params;
      p.custom = !p.custom;
      if (p.custom) {
        p.cunit = ['daily', 'weekly', 'monthly'].indexOf(p.rtype) >= 0 ? p.rtype : 'daily';
        p.cevery = p.every || 1;
        p.crdays = p.rdays.length ? p.rdays.slice() : [E.weekday(p.date || today())];
      }
      fillSheet(sh);
    },
    dpWd(el, sh) {
      const p = sh.params;
      toggleIn(p.crdays, +el.dataset.v);
      el.setAttribute('aria-pressed', String(p.crdays.indexOf(+el.dataset.v) >= 0));
    },
    // プロジェクト・ラベル・報酬・リマインダーを選ぶ画面
    ppSet(el, sh) {
      const g = sh.params.target || {};
      const v = el.dataset.v;
      if (g.kind === 'quick') {
        const q = App.sheets.find((x) => x.id === g.sheet);
        if (q) { q.params.form.proj = v; qaSync(q); }
      } else {
        const t = taskById(g.id);
        if (t) {
          const pr = readProjectSelect(v);
          if (pr.projectId !== (t.projectId || null) || pr.sectionId !== (t.sectionId || null)) {
            t.projectId = pr.projectId;
            t.sectionId = pr.sectionId;
            subtasksOf(t.id).forEach((x) => { x.projectId = pr.projectId; x.sectionId = pr.sectionId; });
            commit(['todo']);
            refreshTaskSheets();
          }
        }
      }
      closeSheet(sh.id);
    },
    lpToggle(el, sh) {
      const sel = pickLabelsOf(sh.params);
      toggleIn(sel, el.dataset.id);
      el.setAttribute('aria-pressed', String(sel.indexOf(el.dataset.id) >= 0));
      pickLabelsApply(sh.params);
    },
    lpCreate(el, sh) {
      const p = sh.params;
      const name = String(p.q || '').trim().replace(/^@/, '').slice(0, 20);
      if (!name) return;
      let l = todo().labels.find((x) => x.name === name);
      if (!l) {
        l = { id: newId('l'), name, color: 'ai', order: todo().labels.length };
        todo().labels.push(l);
      }
      const sel = pickLabelsOf(p);
      if (sel.indexOf(l.id) < 0) sel.push(l.id);
      p.q = '';
      commit(['todo']);
      pickLabelsApply(p);
      fillSheet(sh);
    },
    rwQuick(el, sh) { const i = document.querySelector('#' + sh.id + ' #rw-v'); i.value = el.dataset.v; },
    remClear(el, sh) {
      const t = taskById(sh.params.id);
      if (t) { t.reminder = null; commit(['todo']); refreshTaskSheets(); }
      closeSheet(sh.id);
    },
    // タスクの画面：行から、それぞれ選ぶ画面を開く
    teTitleEnter(el) { el.blur(); },
    teDate(el) {
      const t = taskById(el.dataset.id);
      if (!t) return;
      const rp = t.repeat || {};
      openSheet('datePick', { target: { kind: 'task', id: t.id }, kind: 'due', date: t.due ? t.due.date : '', time: t.due && t.due.time ? t.due.time : '', rtype: t.repeat ? rp.type : '', every: rp.every || 1, rdays: (rp.days || []).slice(), withTime: true, withRepeat: !t.parentId, allowNone: true });
    },
    teDeadline(el) {
      const t = taskById(el.dataset.id);
      if (t) openSheet('datePick', { title: '期限', target: { kind: 'deadline', id: t.id }, kind: 'deadline', date: t.deadline || '', time: '', rtype: '', every: 1, rdays: [], allowNone: true });
    },
    teLabels(el) { if (taskById(el.dataset.id)) openSheet('labelPick', { target: { kind: 'task', id: el.dataset.id } }); },
    teRem(el) {
      const t = taskById(el.dataset.id);
      if (t) openSheet('remPick', { id: t.id, had: !!t.reminder, value: t.reminder || ((t.due ? t.due.date : today()) + 'T' + (t.due && t.due.time ? t.due.time : '09:00')) });
    },
    teReward(el) { const t = taskById(el.dataset.id); if (t) openSheet('rewardPick', { target: { kind: 'task', id: t.id }, value: t.reward || 0 }); },
    teMove(el) { const t = taskById(el.dataset.id); if (t) openSheet('projPick', { target: { kind: 'task', id: t.id }, cur: (t.projectId || '') + (t.sectionId ? '|' + t.sectionId : '') }); },
    taskMenu(el) { openSheet('taskMenu', { id: el.dataset.id }); },
    tmDup(el) {
      const id = el.dataset.id;
      closeSheet();
      const t = taskById(id);
      if (!t) return;
      const now = Date.now();
      const copy = JSON.parse(JSON.stringify(t));
      Object.assign(copy, { id: newId('t'), done: false, createdAt: now, order: (t.order || 0) + 0.5 });
      delete copy.doneAt;
      const list = todo().tasks;
      list.push(copy);
      subtasksOf(id).forEach((x) => { const c = JSON.parse(JSON.stringify(x)); Object.assign(c, { id: newId('t'), parentId: copy.id, createdAt: now }); list.push(c); });
      commit(['todo']);
      toast('「' + t.title + '」を複製しました');
    },
    tmDel(el) {
      const id = el.dataset.id;
      closeSheet();
      TODO_ACTIONS.taskDelete({ dataset: { id } }, App.sheets.find((x) => x.type === 'taskEdit' && x.params.id === id));
    },
    subToggle(el, sh) {
      const s = taskById(el.dataset.id);
      if (!s) return;
      saveTitleNote(sh);
      s.done = !s.done;
      if (s.done) s.doneAt = Date.now(); else delete s.doneAt;
      commit(['todo']);
      fillSheet(sh);
    },
    subAdd(el, sh) {
      const inp = document.querySelector('#' + sh.id + ' #te-newsub');
      const title = (inp.value || '').trim();
      if (!title) return;
      saveTitleNote(sh);
      const par = taskById(sh.params.id);
      if (!par) return;
      const order = subtasksOf(par.id).reduce((m, x) => Math.max(m, x.order || 0), -1) + 1;
      todo().tasks.push({ id: newId('t'), title, note: '', projectId: par.projectId, sectionId: par.sectionId, parentId: par.id, order, labels: [], due: null, deadline: null, repeat: null, reminder: null, reward: 0, done: false, createdAt: Date.now() });
      commit(['todo']);
      fillSheet(sh);
      const again = document.querySelector('#' + sh.id + ' #te-newsub');
      if (again) again.focus();
    },
    compOpen(el) { openSheet('comp', { id: el.dataset.id }); },
    compUndo(el, sh) {
      const cp = findComp(el.dataset.id);
      if (!cp) return;
      if (sh) closeSheet(sh.id);
      TodoAct.uncomplete(cp.id);
      toast('「' + cp.title + '」の完了を取り消しました');
    },
    projNew() { openSheet('projForm', {}); },
    projEdit(el) { openSheet('projForm', { id: el.dataset.id }); },
    projMenu(el) { openSheet('projMenu', { id: el.dataset.id }); },
    pmSecNew(el) { const id = el.dataset.id; closeSheet(); openSheet('secForm', { projectId: id }); },
    pmEdit(el) { const id = el.dataset.id; closeSheet(); openSheet('projForm', { id }); },
    projOpen(el) {
      const p = projectById(el.dataset.id);
      closeAllSheets();
      App.ui.homeSeg = 'todo';
      App.ui.tab = 'home';
      App.ui.viewDate = null;
      App.ui.todoTab = 'projects';
      App.ui.todoId = p && !p.archived ? p.id : null;
      render();
    },
    starterAdd() {
      const n = E.addTodoStarter(todo());
      todo().settings.starterAdded = true;
      commit(['todo']);
      refreshStarterRow();
      toast(n ? '初期のプロジェクトとラベルを追加しました' : '追加するものはありません');
    },
    starterRemove() {
      const td = todo();
      const pres = E.starterPresent(td);
      const pids = pres.projects.map((p) => p.id);
      const lids = pres.labels.map((l) => l.id);
      if (!pids.length && !lids.length) return;
      const nTasks = td.tasks.filter((x) => pids.indexOf(x.projectId) >= 0 && !x.parentId).length;
      const nLabeled = td.tasks.filter((x) => (x.labels || []).some((id) => lids.indexOf(id) >= 0)).length;
      const names = (list, pre) => list.map((x) => '「' + pre + x.name + '」').join('');
      const what = [pids.length ? 'プロジェクト' + names(pres.projects, '') : '', lids.length ? 'ラベル' + names(pres.labels, '@') : ''].filter(Boolean).join('と');
      confirmDialog({
        title: '初期のプロジェクトとラベルを削除しますか？',
        body: what + 'を削除します。' + (nTasks ? '中のタスク' + nTasks + '件はInboxに移ります。' : '') + (nLabeled ? 'ラベルはタスクから外れます。' : '') + 'あとからこの設定で、また追加できます。',
        ok: '削除する',
        danger: true,
        onOk: () => {
          E.removeTodoStarter(td);
          td.settings.starterAdded = true;
          commit(['todo']);
          refreshStarterRow();
          toast('初期のプロジェクトとラベルを削除しました');
        },
      });
    },
    pfColor(el, sh) { sh.params.color = el.dataset.v; pressOne(el); },
    lfColor(el, sh) { sh.params.color = el.dataset.v; pressOne(el); },
    projArchive(el, sh) {
      const p = projectById(el.dataset.id);
      if (!p) return;
      p.archived = true;
      if (sh) closeSheet(sh.id);
      App.ui.todoId = null;
      commit(['todo']);
      toast('「' + p.name + '」をアーカイブしました', { label: '元に戻す', fn: () => { p.archived = false; commit(['todo']); } });
    },
    projRestore(el) {
      const p = projectById(el.dataset.id);
      if (!p) return;
      p.archived = false;
      commit(['todo']);
      toast('「' + p.name + '」を元に戻しました');
    },
    projDelete(el) {
      const p = projectById(el.dataset.id);
      if (!p) return;
      const n = todo().tasks.filter((x) => x.projectId === p.id && !x.parentId).length;
      confirmDialog({
        title: '「' + p.name + '」を削除しますか？',
        body: '中の未完了のタスク' + n + '件とセクションも削除され、元に戻せません。これまでに獲得した報酬はそのまま残ります。残しておきたいときはアーカイブを使ってください。',
        ok: '削除する',
        danger: true,
        onOk: () => {
          closeAllSheets();
          const td = todo();
          td.tasks = td.tasks.filter((x) => x.projectId !== p.id);
          td.sections = td.sections.filter((s) => s.projectId !== p.id);
          td.projects = td.projects.filter((x) => x.id !== p.id);
          App.ui.todoId = null;
          commit(['todo']);
          toast('「' + p.name + '」を削除しました');
        },
      });
    },
    secNew(el) { openSheet('secForm', { projectId: el.dataset.project }); },
    secEdit(el) { openSheet('secForm', { id: el.dataset.id }); },
    secDelete(el, sh) {
      const s = sectionById(el.dataset.id);
      if (!s) return;
      if (sh) closeSheet(sh.id);

  /** ホームのお知らせ：時刻を過ぎたタスクのリマインダー */
  function taskReminderNotice() {
    const now = nowLocal();
    const day = now.slice(0, 10);
    const due = liveTasks().filter((x) => x.reminder && x.reminder <= now && x.reminder.slice(0, 10) === day)
      .sort((a, b) => (a.reminder < b.reminder ? -1 : 1));
    if (!due.length) return '';
    const first = due[0];
    return notice('warn', '⏰ リマインダー：「' + esc(first.title) + '」（' + hmLabel(first.reminder.slice(11)) + '）' + (due.length > 1 ? ' ほか' + (due.length - 1) + '件' : ''),
      '<button class="btn-s" data-act="taskOpen" data-id="' + first.id + '">開く</button>');
  }
  /** 履歴の日別画面：その日に完了したタスク */
  function historyTodo(c, d) {
    const comps = c.completionsOn(d);
    const sum = comps.reduce((s, x) => s + (x.reward || 0), 0);
    let h = '<h3 class="dv-h"><span>ToDo</span><span>' + (comps.length ? comps.length + '件 ・ +' + fmt(sum) + ' kcal' : '') + '</span></h3>';
    return h + (comps.length ? '<ul class="task-list">' + comps.map(compRow).join('') + '</ul>' : '<p class="empty">この日に完了したタスクはありません。</p>');
  }

  /** 設定：初期のプロジェクトとラベル（GTD）。まとめて削除・追加できる（1つずつなら、それぞれの編集画面から削除） */
  function starterRow() {
    const td = todo();
    const pres = E.starterPresent(td);
    const miss = E.starterMissing(td);
    const has = pres.projects.length + pres.labels.length;
    const can = miss.projects.length + miss.labels.length;
    const nw = (s) => '<span style="white-space:nowrap">' + esc(s) + '</span>';
    const names = E.TODO_STARTER.projects.map((x) => nw(x.name)).join('・') + ' と ' + E.TODO_STARTER.labels.map((x) => nw('@' + x.name)).join('・');
    const btns = (can ? '<button type="button" class="btn-s" data-act="starterAdd">追加</button>' : '') +
      (has ? '<button type="button" class="btn-s danger-text" data-act="starterRemove">削除</button>' : '');
    return '<div class="set-row" id="todo-starter"><div><b>初期のプロジェクトとラベル</b><p class="hint">GTDの形：' + names +
      (!has ? '（削除済み）' : can ? '（一部を削除済み）' : '') + '</p></div>' + (btns ? '<span class="row-actions">' + btns + '</span>' : '') + '</div>';
  }
  /** 設定画面の「初期のプロジェクトとラベル」の行だけを書き直す（入力中のほかの欄はそのまま） */

    const row = document.getElementById('todo-starter');
    if (!row) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = starterRow();
    row.replaceWith(tmp.firstChild);
  }

      const id = sh.params.id || null;
      closeSheet(sh.id);
      Act.saveHabit(id, { name, reward, freq, maxPerDay: f.maxPerDay });
      toast(id ? '保存しました' : '「' + name + '」を追加しました');
    },
    meal(form, sh) {
      const kcal = toInt(form.querySelector('#mf-kcal').value);
      const name = form.querySelector('#mf-name').value.trim();
      if (!(kcal >= 1 && kcal <= 9999)) { form.querySelector('#mf-err').textContent = 'カロリーは 1〜9999 の整数で入力してください。'; return; }
      const p = sh.params;
      closeSheet(sh.id);
      if (p.id) Act.updateMeal(p.date, p.id, kcal, name);
      else Act.addMeal(p.date, kcal, name);
      toast(p.id ? '保存しました' : fmt(kcal) + ' kcal を追加しました');
    },
    withdraw(form, sh) {
      const amt = toInt(form.querySelector('#wf-amt').value);
      const p = sh.params;
      const cur = ctx().day(p.date).W;
      const can = Math.max(0, (p.maxTotal || 0) - cur);
      if (!(amt >= 1)) { form.querySelector('#wf-err').textContent = '引き出す量を入力してください。'; return; }
      if (amt > can) { form.querySelector('#wf-err').textContent = '引き出せるのは最大 ' + fmt(can) + ' kcal です。'; return; }
      Act.setWithdrawal(p.date, cur + amt);
      closeSheet(sh.id);
      toast(fmt(amt) + ' kcal を引き出して予算に足しました');
    },
    withdrawSet(form, sh) {
      const v = toInt(form.querySelector('#ws-amt').value);
      const p = sh.params;
      const cur = ctx().day(p.date).W;
      const max = p.date === today() ? p.maxTotal || cur : cur;
      if (!(v >= 0)) { form.querySelector('#ws-err').textContent = '0以上の整数で入力してください。'; return; }
      if (v > max) { form.querySelector('#ws-err').textContent = '合計は ' + fmt(max) + ' kcal までです。'; return; }
      Act.setWithdrawal(p.date, v);
      toast(v ? '引き出しを ' + fmt(v) + ' kcal に変更しました' : '引き出しを取り消しました');
    },
    budget(form, sh) {
      const base = toInt(form.querySelector('#sf-base').value);
      const cap = noCapOn(form) ? null : toInt(form.querySelector('#sf-cap').value);
      const loginSw = form.querySelector('[aria-labelledby="sf-login-l"]');
      const login = !!loginSw && loginSw.getAttribute('aria-checked') === 'true';
      const err = form.querySelector('#sf-err');
      const bad = budgetError(base, cap);
      if (bad) { err.textContent = bad; return; }
      Act.saveBudget(base, cap, login);
      fillSheet(sh);
      toast('今日から適用しました');
    },
    setup(form, sh) {
      const base = toInt(form.querySelector('#su-base').value);
      const cap = noCapOn(form) ? null : toInt(form.querySelector('#su-cap').value);
      const err = form.querySelector('#su-err');
      const bad = budgetError(base, cap);
      if (bad) { err.textContent = bad; return; }
      App.data = toDocs(E.makeEmpty(E.logicalDate(new Date(), '00:00'), base, cap, true));
      App.sample = false;
      App.sync = { state: 'idle' };
      App.ui.viewDate = null;
      App.ui.tab = 'home';
      App.rev++;
      claimLogin(true);
      closeAllSheets();
      render();
      pruneCloud().then(() => Store.writeAll());
      toast('準備ができました。習慣を追加しましょう', { label: '習慣を追加', fn: () => openSheet('habitForm', {}) });
    },
  };

  /** 設定の説明に添える：今日の「毎日・曜日指定」の習慣を全部達成したときの報酬 */
  function capHint() {
    if (!App.data) return '';
    const c = ctx();
    const pt = c.dayPotential(c.today);
    return pt.targets ? '。今日の習慣を全部達成すると +' + fmt(pt.targetMax) + ' kcal で、予算は最大 ' + fmt(pt.maxBudget) + ' kcal' : '';
  }

  /** 基本カロリーと報酬上限の入力チェック（問題なければ空文字）。cap が null なら「上限なし」 */
  function budgetError(base, cap) {
    if (!(base >= 0 && base <= 6000)) return '基本カロリーは 0〜6000 で入力してください。';
    if (cap === null) return '';
    if (!(cap >= 0 && cap <= 6000)) return '報酬上限は 0〜6000 で入力してください（決めない場合は「上限なし」をオン）。';
    if (base === 0 && cap === 0) return '基本カロリーを0にするときは、報酬上限に1日に必要な分（例：2500）を入れるか、「上限なし」をオンにしてください。';
    return '';
  }

  /** 「上限なし」のスイッチ（初回設定と設定画面で共通） */
  function noCapRow(prefix, on) {
    return '<div class="set-row nocap-row"><div><b id="' + prefix + '-nocap-l">上限なし</b><p class="hint">獲得した報酬は、すべてその日の予算に入ります</p></div>' +
      '<button type="button" class="switch" role="switch" aria-checked="' + on + '" aria-labelledby="' + prefix + '-nocap-l" data-act="noCapToggle"></button></div>';
  }
  function noCapOn(form) {
    const sw = form.querySelector('[data-act="noCapToggle"]');
    return !!sw && sw.getAttribute('aria-checked') === 'true';
  }

  const CHANGES = {
    closeTime(el) {
      App.data.core.settings.closeTime = el.value;
      commit(['core']);
      toast('締め時刻を ' + hmLabel(el.value) + ' にしました');
    },
    remTime(el) { Act.setReminder({ time: el.value }); },
    hkFile(el, sh) {
      const file = el.files && el.files[0];
      if (!file || !sh) return;
      const r = new FileReader();
      r.onload = () => {
        sh.params.text = String(r.result || '');
        const ta = document.querySelector('#' + sh.id + ' #hk-text');
        if (ta) ta.value = sh.params.text;
        refreshHealthPreview(sh);
      };
      r.onerror = () => toast('ファイルを読み込めませんでした');
      r.readAsText(file);
      el.value = '';
    },
    importFile(el) {
      const file = el.files && el.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => importText(String(r.result || ''));
      r.onerror = () => toast('ファイルを読み込めませんでした');
      r.readAsText(file);
      el.value = '';
    },
  };

  // 習慣を長押し（PCでは右クリックも）すると、その習慣の編集を開く。ふつうに押したときは今までどおり記録
  const LongPress = { timer: 0, x: 0, y: 0, el: null, fired: false };
  function lpCancel() {
    clearTimeout(LongPress.timer);
    if (LongPress.el) LongPress.el.classList.remove('pressing');
    LongPress.el = null;
  }
  function lpOpen(el) {
    lpCancel();
    LongPress.fired = true;
    const id = el.dataset.id;
    if (App.data && habitById(id)) openSheet('habitForm', { id });
  }
  document.addEventListener('pointerdown', (ev) => {
    LongPress.fired = false;
    const el = ev.target.closest('.habit-btn[data-id]');
    if (!el || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    lpCancel();
    LongPress.el = el;
    LongPress.x = ev.clientX;
    LongPress.y = ev.clientY;
    el.classList.add('pressing');
    LongPress.timer = setTimeout(() => lpOpen(el), 500);
  });
  document.addEventListener('pointermove', (ev) => {
    if (LongPress.el && Math.hypot(ev.clientX - LongPress.x, ev.clientY - LongPress.y) > 10) lpCancel(); // 指が動いた（スクロールなど）
  });
  document.addEventListener('pointerup', lpCancel, true);
  document.addEventListener('pointercancel', lpCancel, true);
  document.addEventListener('contextmenu', (ev) => {
    const el = ev.target.closest('.habit-btn[data-id]');
    if (!el) return;
    ev.preventDefault();
    if (!LongPress.fired) lpOpen(el); // 長押しで開いた直後なら、もう一度は開かない
  });
  // 長押しで開いたあと、指を離したときの「押した」は何にも使わない
  // （記録にしない。iPhoneでは指の下が開いたシートの外側になり、閉じてしまうこともあるため。キーボードで押したときは別）
  document.addEventListener('click', (ev) => {
    if (LongPress.fired && ev.detail !== 0) {
      LongPress.fired = false;
      ev.preventDefault();
      ev.stopPropagation();
    }
  }, true);

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act];
    if (!fn) return;
    ev.preventDefault();
    fn(el, sheetOf(el), ev);
  });
  document.addEventListener('submit', (ev) => {
    const form = ev.target.closest('form[data-form]');
    if (!form) return;
    ev.preventDefault();
    const fn = FORMS[form.dataset.form];
    if (fn) fn(form, sheetOf(form));
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target.closest('[data-change]');
    if (!el) return;
    const fn = CHANGES[el.dataset.change];
    if (fn) fn(el, sheetOf(el));
  });
  const INPUTS = {
    hkParse(el, sh) {
      if (!sh) return;
      sh.params.text = el.value;
      refreshHealthPreview(sh);
    },
  };
  Object.assign(SHEETS, TODO_SHEETS, ACCOUNT_SHEETS);
  Object.assign(ACTIONS, TODO_ACTIONS, ACCOUNT_ACTIONS);
  Object.assign(FORMS, TODO_FORMS, ACCOUNT_FORMS);
  Object.assign(CHANGES, TODO_CHANGES);
  Object.assign(INPUTS, TODO_INPUTS);
  document.addEventListener('input', (ev) => {
    const el = ev.target.closest('[data-input]');
    if (!el) return;
    const fn = INPUTS[el.dataset.input];
    if (fn) fn(el, sheetOf(el));
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && App.sheets.length) { ev.preventDefault(); closeSheet(); return; }
    // data-enter：Enterでその操作をする（日本語の変換を確定するEnterでは動かさない）
    const el = ev.target.closest && ev.target.closest('[data-enter]');
    if (el && ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229) {
      const fn = ACTIONS[el.dataset.enter];
      if (fn) { ev.preventDefault(); fn(el, sheetOf(el)); }
    }
  });
  /** 文字に合わせて高さが伸びる入力欄（タスク名・説明） */
  function grow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
  function growAll(root) { (root || document).querySelectorAll('textarea[data-grow]').forEach(grow); }
  document.addEventListener('input', (ev) => { if (ev.target.matches && ev.target.matches('textarea[data-grow]')) grow(ev.target); });

  let toastTimer = null;
  function toast(msg, action, kind) {
    const el = $('#toast');
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button">' + esc(action.label) + '</button>' : '');
    if (action) el.querySelector('button').onclick = () => { el.classList.remove('show'); action.fn(); };
    el.classList.toggle('bonus', kind === 'bonus');
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), action ? 5500 : kind === 'bonus' ? 4200 : 2800);
  }

  // ===================== 起動 =====================
  function waitForClaude(ms) {
    return new Promise((resolve) => {
      let left = Math.ceil(ms / 50);
      (function poll() {
        const c = window.claude;
        if (c && typeof c.use === 'function') return resolve(c);
        if (left-- <= 0) return resolve(null);
        setTimeout(poll, 50);
      })();
    });
  }
  function clockKey() {
    if (!App.data) return '';
    const t = today();
    const rem = App.data.core.settings.reminder;
    return t + '|' + (rem && rem.enabled ? reminderDue(rem.time, t) : '');
  }
  async function boot(hotData) {
    if (hotData && hotData.ui) Object.assign(App.ui, hotData.ui);
    render();
    if (Native.on) { await bootDevice(); return; }
    let cloudOk = false;
    let triedCloud = false;
    const cl = /(^|\.)(github\.io|web\.app|firebaseapp\.com)$/.test(location.hostname) ? null : await waitForClaude(1200);
    if (cl) {
      try {
        const got = await Promise.all([cl.use('db'), cl.use('user'), cl.use('downloads').catch(() => null)]);
        const db = got[0];
        const user = got[1];
        Dl = got[2] || null;
        const uid = user ? await user.id() : null;
        if (db && uid) {
          triedCloud = true;
          Store.mode = 'cloud';
          Store.adapter = Cloud;
          cloudOk = await Cloud.start(db, uid);
        }
      } catch (e) {
        cloudOk = false;
      }
    }
    if (!cloudOk) {
      const saved = Local.read();
      Store.mode = Local.ok ? 'local' : 'memory';
      Store.adapter = Local.ok ? Local : null;
      if (triedCloud) Store.problem = 'クラウドに接続できなかったため、このブラウザに保存しています。';
      if (saved) loadSaved(saved);
    }
    started();
    if (Account.usable()) {
      await Account.load();
      Sync.start();
    }
  }
  /** iPhoneアプリとして起動したとき：iPhoneの中のファイルから読み込む */
  async function bootDevice() {
    Store.mode = 'device';
    Store.adapter = Device;
    const saved = await Device.read();
    if (saved) loadSaved(saved);
    started();
    await Account.load();
    Sync.start();
  }
  function loadSaved(saved) {
    const data = { core: normalizeCore(saved.core), months: {}, todo: normalizeTodo(saved.todo), comps: {}, logins: {} };
    if (!data.core) return;
    for (const k of Object.keys(saved.months || {})) data.months[k] = normalizeMonth(saved.months[k]);
    for (const k of Object.keys(saved.comps || {})) data.comps[k] = normalizeComps(saved.comps[k]);
    for (const k of Object.keys(saved.logins || {})) data.logins[k] = normalizeLogins(saved.logins[k]);
    App.data = data;
    App.rev++;
  }
  function started() {
    if (!App.data) enterSample();
    if (!Account.usable() || !Account.knownSignedIn()) { ensureLoginMode(); ensureTodoStarter(); } // ログイン中は、最初の同期のあとで
    render();
    hideSplash();
    claimLogin();
    runSync(true);
    Notify.soon();
    let last = clockKey();
    const tick = () => {
      const k = clockKey();
      if (k !== last) { last = k; render(); Notify.soon(); claimLogin(); }
    };
    setInterval(tick, 20000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        Store.flushNow();
        if (Account.st) { Account.writeNow(); if (Object.keys(Account.st.pending).length) Sync.run(); }
        return;
      }
      tick();
      claimLogin();
      Notify.soon();
      Sync.soon(300);
    });
    window.addEventListener('pagehide', () => { Store.flushNow(); if (Account.st) Account.writeNow(); });
    window.addEventListener('online', () => Sync.soon(300));
    const onScroll = () => {
      const on = window.scrollY > 64;
      if (on !== document.body.classList.contains('scrolled')) document.body.classList.toggle('scrolled', on);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
  }

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    try {
      hot.snapshot(() => ({ ui: { tab: App.ui.tab, viewDate: App.ui.viewDate, histMonth: App.ui.histMonth, histSel: App.ui.histSel, remainOpen: App.ui.remainOpen, mealsOpen: App.ui.mealsOpen, homeSeg: App.ui.homeSeg, todoTab: App.ui.todoTab, todoId: App.ui.todoId } }));
    } catch (e) { /* 無視 */ }
  }
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
})();

</script>
</body>
</html>
