  }

  // ===================== 状態 =====================
  const App = {
    data: null, // { core, months: { 'YYYY-MM': { entries, meals, withdrawals, confirmed } }, todo, comps: { 'YYYY-MM': { completions } }, logins: { 'YYYY-MM': { days } } }
    sample: false,
    rev: 0,
    ui: { tab: 'home', viewDate: null, remainOpen: false, mealsOpen: false, histMonth: null, histSel: null },
    sync: { state: 'idle' },
    sheets: [],
    loadSlow: false,
  };
  let Dl = null; // downloads 機能
  let dragging = false;

  // ===================== iPhoneアプリ（Capacitor）として動くときの部分 =====================
  // Webページ（claude.ai）では Native.on が false になり、ここの処理は使われない。
  const APP_VERSION = '1.0.0';
  const Native = (function () {
    const C = window.Capacitor;
    let on = false;
    try {
      on = !!C && (typeof C.isNativePlatform === 'function' ? C.isNativePlatform() : (typeof C.getPlatform === 'function' && C.getPlatform() !== 'web'));
    } catch (e) {
      on = false;
    }
    /** ネイティブ機能（プラグイン）を呼ぶ。プラグインが無ければ失敗として返す */
    function call(plugin, method, opts) {
      const P = C && C.Plugins && C.Plugins[plugin];
      try {
        if (P && typeof P[method] === 'function') return Promise.resolve(P[method](opts || {}));
        if (C && typeof C.nativePromise === 'function') return C.nativePromise(plugin, method, opts || {});
      } catch (e) {
        return Promise.reject(e);
      }
      return Promise.reject(new Error(plugin + '.' + method + ' を使えません'));
    }
    return { on, call };
  })();

  /** iPhoneの中（アプリ専用のファイル）に保存する。localStorageにも控えを置く */
  const Device = {
    FILE: 'calotas-data.json',
    whole: true, // 1回の保存で全体を書く
    body() {
      return JSON.stringify({ app: 'calotas', v: 3, savedAt: Date.now(), core: App.data.core, months: App.data.months, todo: App.data.todo, comps: App.data.comps, logins: App.data.logins });
    },
    async read() {
      let file = null;
      try {
        const r = await Native.call('Filesystem', 'readFile', { path: this.FILE, directory: 'DATA', encoding: 'utf8' });
        file = r && typeof r.data === 'string' ? JSON.parse(r.data) : null;
      } catch (e) {
        file = null; // まだ無い、または読めない
      }
      const ls = Local.read();
      if (file && ls && (ls.savedAt || 0) > (file.savedAt || 0)) return ls; // ファイルの書き込みが間に合わなかったとき
      return file || ls;
    },
    async write() {
      const s = this.body();
      try { window.localStorage.setItem(Local.KEY, s); } catch (e) { /* ファイルに書ければよい */ }
      await Native.call('Filesystem', 'writeFile', { path: this.FILE, directory: 'DATA', encoding: 'utf8', data: s });
    },
    async clear() {
      try { await Native.call('Filesystem', 'deleteFile', { path: this.FILE, directory: 'DATA' }); } catch (e) { /* もともと無い */ }
      await Local.clear();

  };

  /** 通知（習慣のリマインダーと、ToDoのリマインダー）。アプリを開くたび・記録を変えるたびに組み直す */
  const Notify = {
    timer: null,
    sig: '',
    state: '', // '' | 'granted' | 'denied'
    MAX_TASKS: 56, // iOSは1アプリ64件まで。習慣の7日分と合わせて63件以内
    soon() {
      if (!Native.on) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.sync(), 700);
    },
    plan(nowMs) {
      const out = [];
      if (!App.data || App.sample) return out;
      const now = nowMs || Date.now();
      const c = ctx();
      const t = c.today;
      const rem = App.data.core.settings.reminder;
      if (rem && rem.enabled) {
        for (let i = 0; i < 7; i++) {
          const d = E.addDays(t, i);
          const at = localMs(d, rem.time);
          if (at <= now + 30000) continue;
          const n = c.unmetTargets(d);
          if (n <= 0) continue; // その日の対象の習慣がない、またはすべて25%以上
          out.push({ key: 'h|' + d, at, title: '習慣のリマインダー', body: 'まだ25%未満の習慣が' + n + '件あります。' });
        }
      }
      const tasks = liveTasks()
        .filter((x) => x.reminder)
        .map((x) => ({ x, at: localMs(x.reminder.slice(0, 10), x.reminder.slice(11, 16)) }))
        .filter((o) => o.at > now + 30000)
        .sort((a, b) => a.at - b.at)
        .slice(0, this.MAX_TASKS);
      for (const o of tasks) {
        out.push({ key: 't|' + o.x.id + '|' + o.x.reminder, at: o.at, title: o.x.title || 'ToDo', body: 'ToDoのリマインダー' + (o.x.reward > 0 ? '（完了すると +' + fmt(o.x.reward) + ' kcal）' : '') });
      }
      return out;
    },
    async sync() {
      if (!Native.on || !App.data) return;
      const list = this.plan();
      const sig = JSON.stringify(list.map((n) => [n.key, n.at, n.title, n.body]));
      if (sig === this.sig) return;
      try {
        if (list.length) {
          let p = await Native.call('LocalNotifications', 'checkPermissions');
          if (p && p.display !== 'granted' && p.display !== 'denied') p = await Native.call('LocalNotifications', 'requestPermissions');
          const st = p && p.display === 'granted' ? 'granted' : 'denied';
          if (st !== this.state) { this.state = st; refreshSheets(); }
          if (st !== 'granted') { this.sig = ''; return; }
        }
        const pend = await Native.call('LocalNotifications', 'getPending');
        const old = ((pend && pend.notifications) || []).map((n) => ({ id: n.id }));
        if (old.length) await Native.call('LocalNotifications', 'cancel', { notifications: old });
        if (list.length) {
          const used = new Set();
          const notes = list.map((n) => {
            let id = hashId(n.key);
            while (used.has(id)) id = (id % 2147483646) + 1;
            used.add(id);
            return { id, title: n.title, body: n.body, schedule: { at: new Date(n.at) } };
          });
          await Native.call('LocalNotifications', 'schedule', { notifications: notes });
        }
        this.sig = sig;
      } catch (e) {
        this.sig = ''; // 次の機会にやり直す
      }
    },
  };
  function hashId(s) {
    let h = 7;
    for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) | 0;
    return (h & 0x7fffffff) % 2147483646 + 1;
  }
  /** 'YYYY-MM-DD' と 'HH:MM' から、その端末の時刻（ミリ秒）を作る */
  function localMs(ymd, hm) {
    const p = E.parseYmd(ymd);
    const m = String(hm || '00:00').split(':');
    return new Date(p.getFullYear(), p.getMonth(), p.getDate(), Number(m[0]) || 0, Number(m[1]) || 0, 0, 0).getTime();
  }
  /** バックアップをファイルにして、共有シート（「ファイル」に保存・AirDropなど）を開く */
  async function shareBackup() {
    const name = 'calotas-backup-' + today() + '.json';
    const w = await Native.call('Filesystem', 'writeFile', { path: name, directory: 'CACHE', encoding: 'utf8', data: exportJson() });
    await Native.call('Share', 'share', { title: 'カロタスのバックアップ', files: [w.uri], dialogTitle: 'バックアップを保存' });
  }
  function hideSplash() {

  if (Native.on) {

  /** キーボード（iPhoneアプリ）。
   *  画面の大きさは変えない（capacitor.config.json の Keyboard.resize は none）。キーボードが動き始める知らせ
   *  （keyboardWillShow）で高さを --kb に入れると、シートがその分だけ下に余白を足して、キーボードと一緒に上がる。
   *  以前の resize: native は、キーボードが出きってからさらに0.2秒待って画面を縮めるため、
   *  入力欄が一度キーボードに隠れてから、シートが跳ね上がっていた。 */
  const Kb = {
    h: 0,
    timer: 0,
    set(px) {
      const h = Math.max(0, Math.round(Number(px) || 0));
      if (h === this.h) return;
      this.h = h;
      const root = document.documentElement;
      root.style.setProperty('--kb', h + 'px');
      root.classList.toggle('kb-open', h > 0);
      clearTimeout(this.timer);
      if (h > 0) this.timer = setTimeout(revealFocused, 320); // シートが上がりきってから
    },
  };
  const isField = (el) => !!el && typeof el.matches === 'function' && el.matches('input, textarea, select');
  /** 入力中の欄が、シートの見えている部分（キーボードより上）から外れていたら、シートの中をスクロールして見せる */
  function revealFocused() {
    const el = document.activeElement;
    const body = isField(el) && el.closest('.sheet-body');
    if (!body) return;
    const r = el.getBoundingClientRect();
    const b = body.getBoundingClientRect();
    const top = b.top + 8;
    const bottom = Math.min(b.bottom, window.innerHeight - Kb.h) - 12;
    if (r.bottom > bottom) body.scrollTop += Math.max(0, Math.min(r.bottom - bottom, r.top - top));
    else if (r.top < top) body.scrollTop -= top - r.top;
  }

    // プラグインは同じ知らせを2つの通り道で送る（window のイベントと、Capacitor.addListener）。どちらで届いてもよい
    const KB_EVENTS = { keyboardWillShow: true, keyboardDidShow: true, keyboardWillHide: false, keyboardDidHide: false };
    for (const name of Object.keys(KB_EVENTS)) {
      const handle = (d) => Kb.set(KB_EVENTS[name] ? d && d.keyboardHeight : 0);
      window.addEventListener(name, handle);
      try {
        if (typeof window.Capacitor.addListener === 'function') window.Capacitor.addListener('Keyboard', name, handle);
      } catch (e) { /* window のイベントだけで動く */ }
    }

    document.addEventListener('focusout', () => {
      setTimeout(() => { if (Kb.h && !isField(document.activeElement)) Kb.set(0); }, 600);
    });

  }


  function closeTime() { return (App.data && App.data.core.settings.closeTime) || '00:00'; }
  function today() { return E.logicalDate(new Date(), closeTime()); }
  function viewDate() {
    const t = today();
    const v = App.ui.viewDate;
    return v && v < t ? v : t;
  }
  let flatCache = { rev: -1, v: null };
  function flat() {
    if (flatCache.rev === App.rev) return flatCache.v;
    const entries = [], meals = [], withdrawals = {}, confirmed = {}, completions = [];
    for (const k of Object.keys(App.data.months)) {
      const m = App.data.months[k];
      for (const e of m.entries) entries.push(e);
      for (const x of m.meals) meals.push(x);
      Object.assign(withdrawals, m.withdrawals);
      Object.assign(confirmed, m.confirmed);
    }
    for (const k of Object.keys(App.data.comps || {})) for (const c of App.data.comps[k].completions) completions.push(c);
    const logins = {};
    for (const k of Object.keys(App.data.logins || {})) for (const d of App.data.logins[k].days) logins[d] = true;
    flatCache = { rev: App.rev, v: { core: App.data.core, entries, meals, withdrawals, confirmed, completions, logins } };
    return flatCache.v;
  }
  let ctxCache = { rev: -1, today: '', v: null };
  function ctx() {
    const t = today();
    if (ctxCache.rev === App.rev && ctxCache.today === t) return ctxCache.v;
    ctxCache = { rev: App.rev, today: t, v: E.context(flat(), t) };
    return ctxCache.v;
  }
  function emptyMonth() { return { entries: [], meals: [], withdrawals: {}, confirmed: {} }; }
  function monthDoc(date) {
    const k = E.monthKey(date);
    if (!App.data.months[k]) App.data.months[k] = emptyMonth();
    return App.data.months[k];
  }
  function habits() { return App.data.core.habits.slice().sort((a, b) => a.order - b.order); }
  function habitById(id) { return App.data.core.habits.find((h) => h.id === id); }
  function isDemo() { return !!(App.data && App.data.core.ext && App.data.core.ext.mode === 'demo'); }
  function demoSyncPending() { return isDemo() && App.sync.state !== 'done'; }
  function healthMode() { return !!(App.data && App.data.core.ext && App.data.core.ext.mode === 'health'); }
  function importedToday() {
    const at = App.data.core.ext.lastSyncAt;
    return !!at && E.logicalDate(new Date(at), closeTime()) === today();
  }
  /** 食事の配列を月ごとの記録に戻す。変わった月のキーを返す */
  function replaceMeals(meals, changed) {
    const touched = new Set();
    for (const x of changed) touched.add(E.monthKey(x.date));
    for (const k of touched) {
      if (!App.data.months[k]) App.data.months[k] = emptyMonth();
      App.data.months[k].meals = meals.filter((m) => E.monthKey(m.date) === k);
    }
    return Array.from(touched);
  }

  function commit(keys) {
    App.rev++;
    if (!App.sample) for (const k of keys) Store.markDirty(k);
    render();
    Notify.soon();
  }

  // ===================== 操作 =====================
  const Act = {
    setLevel(habitId, date, entryId, level) {
      const h = habitById(habitId);
      if (!h) return;
      const m = monthDoc(date);
      let delta;
      if (entryId) {
        const e = m.entries.find((x) => x.id === entryId);
        if (!e) return;
        const before = E.entryKcal(e);
        e.level = level;
        delta = E.entryKcal(e) - before;
      } else {
        const e = { id: newId('e'), habitId, date, level, reward: E.recordVersion(h, date).reward, ts: Date.now() };
        m.entries.push(e);
        delta = E.entryKcal(e);
      }
      Fx.queue({ habitId, delta, pop: true });
      commit([E.monthKey(date)]);
    },
    removeEntry(date, entryId) {
      const m = monthDoc(date);
      const i = m.entries.findIndex((x) => x.id === entryId);
      if (i < 0) return;
      const e = m.entries.splice(i, 1)[0];
      Fx.queue({ habitId: e.habitId, delta: -E.entryKcal(e) });
      commit([E.monthKey(date)]);
      toast('記録を取り消しました', { label: '元に戻す', fn: () => { monthDoc(date).entries.push(e); commit([E.monthKey(date)]); } });
    },
    addMeal(date, kcal, name) {
      monthDoc(date).meals.push({ id: newId('m'), date, kcal, name, source: 'manual', time: date === today() ? nowHM() : '', ts: Date.now() });
      commit([E.monthKey(date)]);
    },
    updateMeal(date, id, kcal, name) {
      const x = monthDoc(date).meals.find((m) => m.id === id);
      if (!x) return;
      x.kcal = kcal;
      x.name = name;
      commit([E.monthKey(date)]);
    },
    deleteMeal(date, id) {
      const m = monthDoc(date);
      const i = m.meals.findIndex((x) => x.id === id);
      if (i < 0) return;
      const x = m.meals.splice(i, 1)[0];
      commit([E.monthKey(date)]);
      toast('食事を削除しました', { label: '元に戻す', fn: () => { monthDoc(date).meals.push(x); commit([E.monthKey(date)]); } });
    },
    setWithdrawal(date, amount) {
      const m = monthDoc(date);
      if (amount > 0) m.withdrawals[date] = amount;
      else delete m.withdrawals[date];
      commit([E.monthKey(date)]);
    },
    setConfirmed(date, on) {
      const m = monthDoc(date);
      if (on) m.confirmed[date] = true;
      else delete m.confirmed[date];
      commit([E.monthKey(date)]);
    },
    saveBudget(base, cap, login) {
      const s = App.data.core.settings;
      s.history = E.pushDated(s.history, today(), { base, cap, login: !!login });
      commit(['core']);
    },
    setReminder(patch) {
      const s = App.data.core.settings;
      s.reminder = Object.assign({ enabled: false, time: '21:00' }, s.reminder, patch);
      commit(['core']);
    },
    saveHabit(id, f) {
      const t = today();
      const core = App.data.core;
      if (!id) {
        const order = core.habits.reduce((mx, h) => Math.max(mx, h.order), -1) + 1;
        core.habits.push({
          id: newId('h'), name: f.name, order,
          versions: [{ from: t, reward: f.reward, freq: f.freq, maxPerDay: f.maxPerDay }],
          status: [{ from: t, archived: false }],
        });
      } else {
        const h = habitById(id);
        if (!h) return;
        h.name = f.name;
        h.versions = E.pushDated(h.versions, t, { reward: f.reward, freq: f.freq, maxPerDay: f.maxPerDay });
      }
      commit(['core']);
    },
    archiveHabit(id, archived) {
      const h = habitById(id);

      h.status = E.pushDated(h.status || [], today(), { archived });
      commit(['core']);
    },
    reorder(ids) {
      const rest = App.data.core.habits.filter((h) => ids.indexOf(h.id) < 0).sort((a, b) => a.order - b.order);
      ids.forEach((id, i) => { const h = habitById(id); if (h) h.order = i; });
      rest.forEach((h, i) => { h.order = ids.length + i; });
      commit(['core']);
    },
  };

  // ===================== 演出 =====================
  const Fx = {
    q: null,
    last: null,
    queue(x) { this.q = x; },
    run() {
      const x = this.q;
      this.q = null;
      if (x && !reduceMotion()) {
        const row = document.querySelector('[data-habit-row="' + x.habitId + '"]');
        if (row) {
          if (x.pop && x.delta >= 0) {
            const st = row.querySelectorAll('svg.stamp');
            const s = st[st.length - 1];
            if (s) { s.classList.remove('pop'); s.getBoundingClientRect(); s.classList.add('pop'); }
          }
          if (x.delta) {
            const b = document.createElement('span');
            b.className = 'kcal-fly' + (x.delta < 0 ? ' neg' : '');
            b.textContent = (x.delta > 0 ? '+' : '−') + fmt(x.delta) + ' kcal';
            row.appendChild(b);
            setTimeout(() => b.remove(), 1300);
          }
        }
      }
      this.count();
    },
    count() {
      const el = document.querySelector('[data-remain]');
      if (!el) { this.last = null; return; }
      const key = el.getAttribute('data-date');
      const to = +el.getAttribute('data-remain');
      const prev = this.last;
      this.last = { key, v: to };
      if (!prev || prev.key !== key || prev.v === to || reduceMotion()) return;
      const from = prev.v;
      const t0 = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - t0) / 480);
        const k = 1 - Math.pow(1 - p, 3);
        if (el.isConnected) el.textContent = numText(Math.round(from + (to - from) * k));
        if (p < 1 && el.isConnected) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },
  };

  // ===================== 描画：共通 =====================
  function render() {

    showSelectedTodoTab();
    refreshSheets();
    Fx.run();
  }
  /** ToDoのタブは横に流れるので、選んでいるタブ（右のほうのプロジェクト・ラベルも）が見えるようにする */
  function showSelectedTodoTab() {

    const fab = t === 'home' ? '<button class="fab" data-act="' + (todoFab ? 'taskNew' : 'addMenu') + '" aria-label="' + (todoFab ? 'タスクを追加' : '追加する（タスク・食事・習慣）') + '">' + IC.plus + '</button>' : '';

  const badge = (cls, text) => '<span class="badge ' + cls + '">' + text + '</span>';
  const notice = (cls, text, action) => '<div class="notice ' + cls + '"><span>' + text + '</span>' + (action || '') + '</div>';
  function field(label, control, hint, forId) {
    return '<div class="field">' + (forId ? '<label for="' + forId + '">' + label + '</label>' : '<span class="lbl">' + label + '</span>') + control + (hint ? '<p class="hint">' + hint + '</p>' : '') + '</div>';
  }
  function reminderDue(time, t) {
    const now = new Date();
    if (E.ymd(now) > t) return true; // 0時を過ぎて締め前
    return now.getHours() * 60 + now.getMinutes() >= E.hmToMin(time);
  }

  // ===================== ホーム =====================
  function viewHome() {
    const c = ctx();
    const t = c.today;
    const d = viewDate();
    const L = c.day(d);
    return topbarHome(d, t) + noticesHome(c, d, t, L) + remainBlock(c, d, t, L) + homeSwitch(L) +
      (App.ui.homeSeg === 'todo' ? todoCard(c, d, t) : habitsCard(c, d, t)) +
      bankCard(c, d, t, L) + mealsCard(c, d, t, L);
  }

  function topbarHome(d, t) {
    return '<header class="topbar"><div class="tb-nav">' +
      '<button class="icon-btn" data-act="day" data-n="-1" aria-label="前の日">' + IC.left + '</button>' +
      '<button class="icon-btn" data-act="day" data-n="1" aria-label="次の日"' + (d >= t ? ' disabled' : '') + '>' + IC.right + '</button>' +
      (d !== t ? '<button class="chip" data-act="goToday">今日へ</button>' : '') + '</div>' +
      '<span class="tb-title" aria-hidden="true">' + relLabel(d, t) + ' ' + shortDate(d) + '</span>' +
      '<button class="icon-btn" data-act="settings" aria-label="設定">' + IC.gear + '</button></header>' +
      '<h1 class="page-head"><button class="date-btn" data-act="calendar" aria-label="' + dateLabel(d) + '。カレンダーから日付を選ぶ">' +
      '<span class="date-rel">' + relLabel(d, t) + '</span><span class="date-full">' + dateLabel(d) + IC.down + '</span></button></h1>';
  }

  function noticesHome(c, d, t, L) {
    const out = [];
    const led = c.ledger;
    if (App.sample) {
      const login = Account.usable() && !Account.st;
      out.push('<div class="sample-bar"><div><b>サンプルを表示中</b>3週間分の例です。操作は試せますが保存されません。' + (login ? 'ほかの端末で使っている人はログインしてください。' : '') + '</div>' +
        '<div class="sample-acts">' + (login ? '<button class="ghost" data-act="acctOpen">ログイン</button>' : '') + '<button data-act="startOwn">自分の設定で始める</button></div></div>');
    }
    if (Store.problem) out.push(notice('bad', esc(Store.problem)));
    const sn = syncNotice();
    if (sn) out.push(sn);
    if (d === t) {
      const tr = taskReminderNotice();
      if (tr) out.push(tr);
      const rem = App.data.core.settings.reminder;
      if (rem && rem.enabled && reminderDue(rem.time, t)) {
        const n = c.unmetTargets(t);
        if (n > 0) out.push(notice('warn', 'リマインダー：まだ25%未満の習慣が' + n + '件あります。'));
      }
      if (led.pendingDays.length) {
        const pd = led.pendingDays[led.pendingDays.length - 1];
        out.push(notice('', '食事が未確認の日が' + led.pendingDays.length + '日あります。確認すると +' + fmt(led.pending) + ' kcal が貯金に入ります。',
          '<button class="btn-s" data-act="openDate" data-date="' + pd + '">' + shortDate(pd) + 'を開く</button>'));
      }
    } else if (L.pend > 0) {
      out.push(notice('', 'この日は食事データがないため、+' + fmt(L.pend) + ' kcal の精算を保留しています。食事がなかった日なら確認済みにしてください。',
        '<button class="btn-s" data-act="confirmDay" data-date="' + d + '">確認済みにする</button>'));
    }
    if (led.balance < 0) out.push(notice('bad', '貯金がマイナスです（' + numText(led.balance) + ' kcal）。今後の報酬で解消されるまで、引き出しはできません。'));
    return out.length ? '<div class="notices">' + out.join('') + '</div>' : '';
  }

  function dayBadges(d, t, L) {
    const b = [];
    const noMeals = !L.hasMeals && !L.confirmed;
    if (d === t && demoSyncPending()) {
      b.push(badge('warn', App.sync.state === 'syncing' ? '同期中・暫定' : App.sync.state === 'failed' ? '同期できず・暫定' : '同期待ち・暫定'));
    } else if (d === t && healthMode() && !importedToday()) {
      b.push(badge('warn', '未取り込み・暫定'));
    } else if (noMeals) b.push(badge('warn', '食事未記録・暫定'));
    if (L.closed) b.push(L.settled ? badge('plain', '精算済み') : badge('warn', '精算保留'));
    if (L.A > 0) b.push(badge('warn', '貯金から ' + fmt(L.A) + ' 補填'));
    return b.join('');
  }

  function remainBlock(c, d, t, L) {
    const neg = L.remaining < 0;
    const open = App.ui.remainOpen;
    const pot = d === t ? c.dayPotential(d) : null;
    return '<section class="remain' + (neg ? ' neg' : '') + '" aria-label="残りカロリー">' +
      '<button class="remain-main" data-act="toggleRemain" aria-expanded="' + open + '" aria-controls="breakdown">' +
      '<span class="remain-top"><span class="remain-label">' + (neg ? '予算オーバー' : '残り') + '</span>' + dayBadges(d, t, L) + '</span>' +
      '<span class="remain-num"><span data-remain="' + L.remaining + '" data-date="' + d + '">' + numText(L.remaining) + '</span><small>kcal</small></span>' +
      '<span class="remain-meta">予算 ' + fmt(L.budget) + ' kcal ・ 食事 ' + fmt(L.M) + ' kcal ・ 内訳' + IC.down + '</span></button>' +
      budgetBar(L, pot) + potLine(L, pot) + (open ? breakdown(d, t, L, pot) : '') + '</section>';
  }
  /** 「毎日・曜日指定」の習慣を全部達成したときの、その日の予算の最大 */
  function potLine(L, pot) {
    if (!pot || !pot.targets) return '';
    const done = pot.left <= 0;
    const capped = !done && pot.extra <= 0;
    const label = done ? '今日の習慣はすべて達成' : capped ? '報酬が上限の ' + fmt(L.cap) + ' kcal に到達' : '習慣を全部達成すると';
    const max = (done || capped ? '予算は最大の ' : '予算は最大 ') + '<b>' + fmt(pot.maxBudget) + '</b> kcal';
    let note = '';
    if (capped) note = '残りの習慣の報酬は貯金に入ります';
    else if (pot.overCap > 0) note = (done ? '上限を超えた +' : '上限を超える +') + fmt(pot.overCap) + ' kcal は貯金に入ります';
    return '<div class="pot' + (done ? ' done' : '') + '">' +
      '<span class="pot-ic">' + (done ? IC.check : IC.flag) + '</span>' +
      '<span class="pot-main"><span class="pot-label">' + label + '</span><span class="pot-max">' + max + '</span></span>' +
      (done || capped ? '' : '<span class="pot-side">あと<b>+' + fmt(pot.extra) + '</b></span>') +
      (note ? '<span class="pot-note">' + note + '</span>' : '') + '</div>';
  }

  function budgetBar(L, pot) {
    const pools = [['base', L.base], ['reward', L.Rin], ['wd', L.W], ['cover', L.A]];
    const ghost = pot && pot.targets ? pot.extra : 0;
    const total = Math.max(1, L.budget + ghost, L.M);
    let left = L.M;
    let html = '';
    for (const p of pools) {
      const v = p[1];
      if (v <= 0) continue;
      const eaten = Math.min(v, Math.max(0, left));
      left -= eaten;
      html += '<span class="s-' + p[0] + '" style="width:' + pct(v, total) + '">' +
        (eaten > 0 ? '<i class="eaten" style="width:' + pct(eaten, v) + '"></i>' : '') +
        (v - eaten > 0 ? '<i class="left" style="width:' + pct(v - eaten, v) + '"></i>' : '') + '</span>';
    }
    if (ghost > 0) {
      const covered = Math.min(ghost, Math.max(0, left));
      html += '<span class="s-pot" style="width:' + pct(ghost, total) + '">' +
        (covered > 0 ? '<i class="eaten" style="width:' + pct(covered, ghost) + '"></i>' : '') +
        (ghost - covered > 0 ? '<i class="left" style="width:' + pct(ghost - covered, ghost) + '"></i>' : '') + '</span>';
    }
    if (L.M > L.budget + ghost) html += '<span class="s-over" style="width:' + pct(L.M - L.budget - ghost, total) + '"><i class="eaten" style="width:100%"></i></span>';
    const lg = [];
    if (L.base > 0) lg.push('<span><i class="lg-base"></i>基本</span>');
    if (L.Rin > 0) lg.push('<span><i class="lg-reward"></i>報酬</span>');
    if (ghost > 0) lg.push('<span><i class="lg-pot"></i>全部達成で増える分</span>');
    if (L.W > 0) lg.push('<span><i class="lg-wd"></i>引き出し</span>');
    if (L.M > 0) lg.push('<span><i class="lg-eaten"></i>食べた分</span>');
    if (L.M > L.budget) lg.push('<span><i class="lg-over"></i>不足</span>');
    return '<div class="bbar" role="img" aria-label="1日の予算 ' + fmt(L.budget) + ' kcal のうち ' + fmt(L.M) + ' kcal を食事に使用">' + html + '</div>' +
      '<div class="bbar-legend">' + lg.join('') + '</div>';
  }

  function breakdown(d, t, L, pot) {
    const row = (a, b, cls, rcls) => '<tr' + (rcls ? ' class="' + rcls + '"' : '') + '><td>' + a + '</td><td class="' + (cls || '') + '">' + b + '</td></tr>';
    const rows = [
      row(L.login ? (L.logged ? 'ログインボーナス（基本カロリー）' : 'ログインボーナス <small>（この日は開かなかったため 0）</small>') : '基本カロリー', fmt(L.base)),
      row('報酬 <small>（習慣 +' + fmt(L.Rh) + '・ToDo +' + fmt(L.Rt) + '、' + (L.noCap ? '上限なし' : '上限 ' + fmt(L.cap) + ' まで') + '）</small>', '+' + fmt(L.Rin), 'gold'),
    ];
    if (L.W) rows.push(row('貯金から引き出し', '+' + fmt(L.W), 'gold'));
    if (L.A) rows.push(row('貯金から自動補填', '+' + fmt(L.A), 'gold'));
    rows.push(row('1日の予算', fmt(L.budget), '', 'sum'));
    rows.push(row('食事 <small>' + L.mealCount + '件</small>', L.M > 0 ? '−' + fmt(L.M) : '0'));
    rows.push(row('残り', numText(L.remaining), L.remaining < 0 ? 'bad' : '', 'total'));
    const notes = [];
    if (L.X > 0) notes.push('上限を超えた報酬 +' + fmt(L.X) + ' kcal は、すぐに貯金しました。');
    if (!L.closed) {
      if (L.unusedReward > 0 || L.unusedW > 0) {
        notes.push('このままなら締め時刻（' + hmLabel(closeTime()) + '）に、使わなかった報酬 +' + fmt(L.unusedReward) + ' kcal' +
          (L.unusedW > 0 ? 'と、引き出しの残り +' + fmt(L.unusedW) + ' kcal' : '') + ' が貯金に入ります。');
      }
      notes.push('基本カロリーの残りは貯金されません。食事は基本カロリーから先に使った扱いです。');
    } else if (L.settled) {
      if (L.D || L.F) notes.push('締めで +' + fmt(L.D + L.F) + ' kcal を貯金しました。');
      else notes.push('この日の精算は済んでいます。');
    } else if (L.pend > 0) notes.push('食事データがないため、+' + fmt(L.pend) + ' kcal の精算を保留しています。');
    if (L.remaining < 0) notes.push('貯金が足りず、' + fmt(L.remaining) + ' kcal 不足しています。');
    if (pot && pot.targets) {
      notes.push('「毎日・曜日指定」の習慣を全部達成すると報酬は +' + fmt(pot.targetMax) + ' kcal' +
        (pot.overCap > 0 ? '。予算に入るのは上限の ' + fmt(L.cap) + ' kcal までで、超えた分は貯金に入ります。' : '。') + '週N回の習慣と予定外の記録は含みません。');
    }
    notes.push(HEALTH_SHORT);
    return '<div class="breakdown" id="breakdown"><table class="bd-table">' + rows.join('') + '</table><ul class="bd-notes">' +
      notes.map((n) => '<li>' + n + '</li>').join('') + '</ul></div>';
  }

  function habitsCard(c, d, t) {
    const all = habits();
    const target = [], weekly = [], adhoc = [];
    for (const h of all) {
      const k = E.kindOn(h, d);
      if (k === 'target') target.push(h);
      else if (k === 'weekly') weekly.push(h);
      else if (c.habitDay(h.id, d).entries.length) adhoc.push(h);
    }
    const r = c.dayRate(d);
    let html = '<section class="card habits" aria-labelledby="h-habits"><h2 id="h-habits" class="vh">' + (d === t ? '今日の習慣' : 'この日の習慣') + '</h2>';
    if (!all.length) {
      html += '<p class="empty">習慣を登録すると、達成するたびに報酬kcalがもらえます。</p>';
    } else {
      if (r.targets) {
        const p = Math.round(r.rate * 100);
        const pt = c.dayPotential(d);
        html += '<div class="rate"><div class="rate-num nums">' + p + '<small>%</small></div><div class="rate-side"><span>' + r.done + ' / ' + r.targets +
          ' 件が25%以上 ・ <b class="rate-pot">+' + fmt(pt.targetEarned) + ' / ' + fmt(pt.targetMax) + ' kcal</b></span><div class="progress" role="progressbar" aria-label="達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p + '"><i style="width:' + p + '%"></i></div></div>' +
          '<button class="link-btn" data-act="manager">編集</button></div>';
        html += '<ul class="habit-list">' + target.map((h) => habitRow(c, h, d, t, 'target')).join('') + '</ul>';
      } else {
        html += '<div class="rate empty-rate"><span class="muted">この日が対象の「毎日・曜日指定」の習慣はありません。</span><button class="link-btn" data-act="manager">編集</button></div>';
      }
      if (weekly.length) {
        html += '<h3 class="sub-head">週の目標<span>達成率には含めません</span></h3><ul class="habit-list">' +
          weekly.map((h) => habitRow(c, h, d, t, 'weekly')).join('') + '</ul>';
      }
      if (adhoc.length) {
        html += '<h3 class="sub-head">臨時の記録<span>予定外の日の達成</span></h3><ul class="habit-list">' +
          adhoc.map((h) => habitRow(c, h, d, t, 'adhoc')).join('') + '</ul>';
      }
    }
    html += '<div class="add-rows"><button class="add-row" data-act="habitNew">' + IC.plus + '<span>習慣を追加</span></button>' +
      (all.length ? '<button class="add-row quiet" data-act="adhoc">' + IC.stampIc + '<span>予定外の日に記録</span></button>' : '') + '</div>';
    return html + '</section>';
  }

  function habitRow(c, h, d, t, kind) {
    const hd = c.habitDay(h.id, d);
    const v = E.recordVersion(h, d);
    const maxN = v.maxPerDay;
    const n = hd.entries.length;
    const stamps = n
      ? hd.entries.slice(0, 4).map((e) => stamp(e.level)).join('') + (n > 4 ? '<span class="more">+' + (n - 4) + '</span>' : '')
      : stamp(null);
    const meta = [];
    const lab = E.STATE_LABEL[hd.state] + (hd.state === 'partial' ? ' ' + hd.sum + '%' : '');
    meta.push('<span class="st-label ' + hd.state + '">' + lab + '</span>');
    if (kind === 'weekly') {
      const w = c.weekly(h, d);
      const same = E.mondayOf(d) === E.mondayOf(t);
      meta.push('<span class="' + (w.count >= w.n ? 'wk-done' : '') + '">' + (same ? '今週' : 'その週') + ' ' + w.count + '/' + w.n + '日' + (w.count >= w.n ? ' 達成' : '') + '</span>');
    } else if (kind === 'adhoc') {
      meta.push('<span>' + E.freqLabel(v.freq) + '・予定外</span>');
    }
    if (maxN > 1) meta.push('<span>' + n + '/' + maxN + '回</span>');
    const kc = hd.kcal > 0
      ? '<b>+' + fmt(hd.kcal) + '</b><small>kcal</small>'
      : '<b class="zero">0</b><small>最大 ' + fmt(v.reward * maxN) + '</small>';
    return '<li class="habit-row" data-habit-row="' + h.id + '"><button class="habit-btn" data-act="habit" data-id="' + h.id + '" data-date="' + d + '" aria-label="' +
      esc(h.name) + '、' + lab + '。タップして達成度を記録、長押しで編集"><span class="stamps">' + stamps + '</span><span class="habit-text"><span class="habit-name">' +
      esc(h.name) + '</span><span class="habit-meta">' + meta.join('') + '</span></span><span class="habit-kcal">' + kc + '</span></button></li>';
  }

  function bankCard(c, d, t, L) {
    const led = c.ledger;
    const isToday = d === t;
    const capPct = L.cap > 0 ? Math.min(100, (L.R / L.cap) * 100) : (L.R > 0 ? 100 : 0);
    let subR = '習慣 +' + fmt(L.Rh) + ' ・ ToDo +' + fmt(L.Rt) + '<br>' + (L.noCap ? '上限なし' : '上限 ' + fmt(L.cap) + ' kcal');
    if (L.X > 0) subR += ' ・ 超過 +' + fmt(L.X) + ' は貯金へ';
    const subs = [];
    if (led.pending > 0) subs.push('保留 +' + fmt(led.pending));
    if (isToday && L.unusedReward + L.unusedW > 0) subs.push('締めで +' + fmt(L.unusedReward + L.unusedW) + ' 予定');
    if (!isToday) subs.push('この日の締め後 ' + numText(L.balEnd));
    let html = '<section class="card bank" aria-labelledby="h-bank"><div class="sec-head"><h2 id="h-bank">報酬と貯金</h2><button class="link-btn" data-act="bank">通帳' + IC.chev + '</button></div>' +
      '<div class="bank-grid"><div class="bank-cell"><span class="lbl">' + (isToday ? '今日の獲得報酬' : 'この日の獲得報酬') + '</span><span class="val gold">+' + fmt(L.R) + '<small>kcal</small></span>' +
      (L.noCap ? '' : '<div class="cap-bar" aria-hidden="true"><i style="width:' + capPct.toFixed(1) + '%"></i></div>') + '<span class="sub">' + subR + '</span></div>' +
      '<div class="bank-cell"><span class="lbl">貯金残高' + (isToday ? '' : '（いま）') + '</span><span class="val' + (led.balance < 0 ? ' neg' : '') + '">' + numText(led.balance) + '<small>kcal</small></span>' +
      (subs.length ? subs.map((s) => '<span class="sub">' + s + '</span>').join('') : '<span class="sub">期限なしで使えます</span>') + '</div></div>';
    html += '<div class="bank-actions">';
    if (isToday) {
      const can = led.balance >= 0 && L.balBeforeW - L.W > 0;
      html += '<button class="btn gold" data-act="withdraw" data-date="' + d + '"' + (can ? '' : ' disabled') + '>貯金から引き出す</button>';
    }
    if (L.W > 0) {
      html += '<div class="wd-now"><span>' + (isToday ? '今日' : 'この日') + 'の引き出し <b>' + fmt(L.W) + '</b> kcal</span><button class="btn-s" data-act="withdraw" data-date="' + d + '">変更・取り消し</button></div>';
    }
    html += '</div>';
    return html + '</section>';
  }

  function mealsCard(c, d, t, L) {
    const meals = c.mealsOn(d);
    const open = App.ui.mealsOpen;
    let html = '<section class="card meals" aria-labelledby="h-meals"><button class="meals-head" data-act="toggleMeals" aria-expanded="' + open + '" aria-controls="meal-list">' +
      '<h2 id="h-meals">食事</h2><span class="cnt">' + meals.length + '件</span><span class="tot">' + fmt(L.M) + '<small>kcal</small></span>' + IC.down + '</button>';
    if (isDemo() && d === t) html += syncLine();
    else if (healthMode()) html += healthLine();
    if (open) {
      html += meals.length
        ? '<ul class="meal-list" id="meal-list">' + meals.map(mealRow).join('') + '</ul>'
        : '<p class="empty" id="meal-list">この日の食事はまだありません。</p>';
    }
    html += '<div class="add-rows"><button class="add-row" data-act="mealNew">' + IC.plus + '<span>食事を追加</span></button></div>';
    if (!L.hasMeals) {
      html += '<div class="confirm-line">' + (L.confirmed
        ? '<span>食事記録を確認済み（食事なし）</span><button class="btn-s" data-act="unconfirmDay" data-date="' + d + '">取り消す</button>'
        : '<span>食事を記録しない日は、確認済みにすると精算できます。</span><button class="btn-s" data-act="confirmDay" data-date="' + d + '">確認済みにする</button>') + '</div>';
    }
    return html + '</section>';
  }
  function mealName(m) { return m.name || (m.source === 'external' ? m.src || '食事' : '手動入力'); }
  function mealTag(m) { return m.source === 'external' ? '<span class="tag ext">ヘルスケア</span>' : '<span class="tag">手動</span>'; }
  function mealRow(m) {
    const ext = m.source === 'external';
    return '<li><span class="t">' + (m.time ? hmLabel(m.time) : '—') + '</span><span class="n">' + esc(mealName(m)) + mealTag(m) + '</span><span class="k">' + fmt(m.kcal) + '</span>' +
      (ext ? '<span></span>' : '<button class="btn-s" data-act="mealEdit" data-id="' + m.id + '" data-date="' + m.date + '">編集</button>') + '</li>';
  }
  function syncLine() {
    const s = App.sync;
    const ext = App.data.core.ext;
    let dot = '';
    let text;
    if (s.state === 'syncing') { dot = 'busy'; text = 'ヘルスケア（デモ）と同期中…'; }
    else if (s.state === 'failed') { dot = 'bad'; text = '同期できませんでした。前回のデータを表示中'; }

  // ===================== 履歴 =====================
  const MARK = { ok: '●', covered: '◆', over: '▲', provisional: '○' };
  function shiftMonth(ym, n) {
    const p = ym.split('-');
    const d = new Date(+p[0], +p[1] - 1 + n, 1, 12);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function rateClass(r) {
    if (r.rate === null) return 'rn';
    if (r.rate >= 1) return 'r3';
    if (r.rate >= 0.5) return 'r2';
    if (r.rate > 0) return 'r1';
    return 'r0';
  }
  function calendar(c, ym, sel, mode) {
    const t = c.today;
    const p = ym.split('-');
    const nextYm = shiftMonth(ym, 1);
    let html = '<div class="cal-head"><button class="icon-btn" data-act="calMonth" data-ym="' + shiftMonth(ym, -1) + '" data-mode="' + mode + '" aria-label="前の月">' + IC.left + '</button>' +
      '<h2>' + p[0] + '年' + (+p[1]) + '月</h2><button class="icon-btn" data-act="calMonth" data-ym="' + nextYm + '" data-mode="' + mode + '" aria-label="次の月"' + (nextYm > E.monthKey(t) ? ' disabled' : '') + '>' + IC.right + '</button></div>';
    html += '<div class="cal-grid">' + ['月', '火', '水', '木', '金', '土', '日'].map((w, i) => '<div class="cal-wd' + (i === 5 ? ' sat' : i === 6 ? ' sun' : '') + '" aria-hidden="true">' + w + '</div>').join('');
    const first = ym + '-01';
    const last = E.addDays(shiftMonth(ym, 1) + '-01', -1);
    const end = E.addDays(E.mondayOf(last), 6);
    for (let d = E.mondayOf(first); d <= end; d = E.addDays(d, 1)) {
      const inMonth = E.monthKey(d) === ym;
      const num = +d.slice(8);
      if (d > t) {
        html += '<div class="cal-cell fut' + (inMonth ? '' : ' out') + '" aria-hidden="true"><span class="cd">' + num + '</span><span class="mk" style="visibility:hidden">·</span></div>';
        continue;
      }
      const r = c.dayRate(d);
      const st = E.dayStatus(c.ledger.days[d]);
      const mk = MARK[st] ? '<span class="mk ' + st + '">' + MARK[st] + '</span>' : '<span class="mk" style="visibility:hidden">·</span>';
      const aria = dateLabel(d) + (r.rate === null ? '' : '、達成率' + Math.round(r.rate * 100) + '%') + ({ ok: '、予算内', covered: '、貯金で補填', over: '、予算不足', provisional: '、暫定' }[st] || '');
      html += '<button class="cal-cell ' + rateClass(r) + (inMonth ? '' : ' out') + (d === sel ? ' sel' : '') + (d === t ? ' today' : '') +
        '" data-act="' + (mode === 'hist' ? 'histSel' : 'pickDate') + '" data-date="' + d + '" aria-label="' + aria + '"' + (d === sel ? ' aria-pressed="true"' : '') + '><span class="cd">' + num + '</span>' + mk + '</button>';
    }
    return html + '</div>';
  }
  function legend() {
    return '<div class="legend"><div><span>達成率</span><span><i class="sw r0"></i>0%</span><span><i class="sw r1"></i>〜49%</span><span><i class="sw r2"></i>50〜99%</span><span><i class="sw r3"></i>100%</span></div>' +
      '<div><span>収支</span><span><span class="mk ok">●</span>予算内</span><span><span class="mk covered">◆</span>貯金で補填</span><span><span class="mk over">▲</span>不足</span><span><span class="mk provisional">○</span>暫定</span></div></div>';
  }
  function viewHistory() {
    const c = ctx();

    const ym = App.ui.histMonth && App.ui.histMonth <= E.monthKey(t) ? App.ui.histMonth : E.monthKey(t);

      (App.sample ? '<div class="sample-bar"><div><b>サンプルを表示中</b>操作は試せますが保存されません。</div><button data-act="startOwn">自分の設定で始める</button></div>' : '') +
      '<section class="card" aria-label="カレンダー">' + calendar(c, ym, sel, 'hist') + legend() + '</section>' +
      '<div class="stats"><div class="stat"><span class="lbl">平均達成率</span><span class="val">' + (s.avgRate === null ? '—' : Math.round(s.avgRate * 100) + '<small>%</small>') + '</span></div>' +

  function dayView(c, d) {
    const t = c.today;
    const L = c.day(d);
    const r = c.dayRate(d);
    const st = E.dayStatus(L);
    const stBadge = { ok: badge('', '予算内'), covered: badge('warn', '貯金で補填'), over: badge('bad', '不足 ' + fmt(L.remaining)), provisional: badge('warn', '暫定') }[st] || '';
    let html = '<section class="card" aria-labelledby="h-dv"><div class="sec-head"><h2 id="h-dv">' + dateLabel(d) + '</h2><span>' + stBadge + '</span></div>' +
      '<div class="dv-sum"><div><span>予算</span><b>' + fmt(L.budget) + '</b></div><div><span>食事</span><b>' + fmt(L.M) + '</b></div><div><span>残り</span><b class="' + (L.remaining < 0 ? 'bad' : '') + '">' + numText(L.remaining) + '</b></div></div>';
    const lines = E.ledgerLines(L);
    if (d === t && L.unusedReward + L.unusedW > 0) lines.push({ label: '締めで貯金予定', amount: L.unusedReward + L.unusedW, kind: 'pending' });
    if (lines.length) {
      html += '<ul class="dv-moves">' + lines.map((x) => '<li' + (x.kind === 'pending' ? ' class="pend"' : '') + '><span>' + x.label + '</span><b class="' + (x.amount > 0 && x.kind !== 'pending' ? 'in' : '') + '">' + signed(x.amount) + '</b></li>').join('') + '</ul>';
    }
    const items = habits().filter((h) => {
      const k = E.kindOn(h, d);
      return k === 'target' || k === 'weekly' || c.habitDay(h.id, d).entries.length;
    });
    html += '<h3 class="dv-h"><span>習慣</span><span>' + (r.targets ? '達成率 ' + Math.round(r.rate * 100) + '%（' + r.done + '/' + r.targets + '）' : '') + '</span></h3>';
    html += items.length ? '<ul class="dv-list">' + items.map((h) => {
      const hd = c.habitDay(h.id, d);
      const k = E.kindOn(h, d);
      const lab = E.STATE_LABEL[hd.state] + (hd.state === 'partial' ? ' ' + hd.sum + '%' : '') + (k === 'weekly' ? ' ・ 週の目標' : k === 'target' ? '' : ' ・ 臨時');
      return '<li><span class="stamps">' + (hd.entries.length ? hd.entries.slice(0, 3).map((e) => stamp(e.level, 26)).join('') : stamp(null, 26)) + '</span><span>' + esc(h.name) +
        '<span class="meta">' + lab + '</span></span><span class="k gold">' + (hd.kcal ? '+' + fmt(hd.kcal) : '') + '</span></li>';
    }).join('') + '</ul>' : '<p class="empty">この日の習慣の記録はありません。</p>';
    html += historyTodo(c, d);
    const meals = c.mealsOn(d);
    html += '<h3 class="dv-h"><span>食事</span><span>' + fmt(L.M) + ' kcal</span></h3>';
    html += meals.length ? '<ul class="dv-list">' + meals.map((m) => '<li><span class="meta">' + (m.time ? hmLabel(m.time) : '—') + '</span><span>' + esc(mealName(m)) +
      mealTag(m) + '</span><span class="k">' + fmt(m.kcal) + '</span></li>').join('') + '</ul>'
      : '<p class="empty">' + (L.confirmed ? '食事なし（確認済み）' : '食事の記録はありません。') + '</p>';
    html += '<div class="btn-row"><button class="btn" data-act="openDate" data-date="' + d + '">この日をホームで開いて編集</button></div></section>';
    return html;
  }

  // ===================== シート =====================
  function openSheet(type, params) {
    const sh = { type, params: params || {}, id: newId('s'), back: document.activeElement };
    App.sheets.push(sh);
    const def = SHEETS[type];
    const layer = document.createElement('div');
    layer.className = 'layer';
    layer.id = sh.id;
    layer.style.zIndex = String(50 + App.sheets.length);
    layer.innerHTML = '<div class="backdrop" data-act="close"></div><div class="sheet' + (def.full ? ' full' : '') + (def.bare ? ' bare' : '') + (def.cls ? ' ' + def.cls : '') + '" role="dialog" aria-modal="true" aria-labelledby="' + sh.id + '-t"></div>';
    $('#sheets').appendChild(layer);
    document.body.classList.add('sheet-open');
    fillSheet(sh);
    const f = layer.querySelector('[autofocus]') || layer.querySelector('#' + sh.id + '-t');
    if (f) try { f.focus({ preventScroll: true }); } catch (e) { /* 古いブラウザ */ }
    return sh;
  }
  function fillSheet(sh) {
    const layer = document.getElementById(sh.id);
    if (!layer) return;
    const def = SHEETS[sh.type];
    const el = layer.querySelector('.sheet');
    const prevBody = el.querySelector('.sheet-body');
    const scroll = prevBody ? prevBody.scrollTop : 0;
    const head = def.title(sh.params);
    const title = typeof head === 'string' ? head : esc(head.t) + (head.sub ? '<span class="sub">' + head.sub + '</span>' : '');
    // 見出し：ふつうは題名と×。def.head があればその形（タスクの画面など）、def.bare なら見出しなし（タスクの追加）
    const headHtml = def.head ? def.head(sh.params, sh)
      : def.bare ? '<h2 id="' + sh.id + '-t" class="sr-only" tabindex="-1">' + title + '</h2>'
        : '<div class="sheet-head"><h2 id="' + sh.id + '-t" tabindex="-1">' + title + '</h2><button class="icon-btn" data-act="close" aria-label="閉じる">' + IC.close + '</button></div>';
    el.innerHTML = headHtml + '<div class="sheet-body">' + def.body(sh.params, sh) + '</div>';
    el.querySelector('.sheet-body').scrollTop = scroll;
    growAll(el);
    if (def.mount) def.mount(el, sh);
  }
  function refreshSheets() {
    if (dragging) return;
    for (const sh of App.sheets) if (SHEETS[sh.type].live) fillSheet(sh);
  }
  function closeSheet(id) {
    const sh = id ? App.sheets.find((s) => s.id === id) : App.sheets[App.sheets.length - 1];
    if (!sh) return;
    const def = SHEETS[sh.type];
    if (def && def.beforeClose) try { def.beforeClose(sh); } catch (e) { /* 閉じるのは止めない */ }
    App.sheets = App.sheets.filter((s) => s !== sh);
    const layer = document.getElementById(sh.id);
    if (layer) layer.remove();
    if (!App.sheets.length) document.body.classList.remove('sheet-open');
    if (sh.back && sh.back.isConnected) try { sh.back.focus({ preventScroll: true }); } catch (e) { /* 無視 */ }
  }
  function closeAllSheets() { while (App.sheets.length) closeSheet(); }
  function sheetOf(el) {

  }

    withdraw: {
      live: true,
      title: (p) => ({ t: '貯金から引き出す', sub: dateLabel(p.date) }),
      body(p) {
        const c = ctx();
        const t = c.today;
        const led = c.ledger;
        const L = c.day(p.date);
        const isToday = p.date === t;
        const cur = L.W;
        const maxTotal = isToday ? E.maxWithdrawal(flat(), p.date, t) : cur;
        const canAdd = Math.max(0, maxTotal - cur);
        p.maxTotal = maxTotal;
        let html = '<div class="dv-sum" style="grid-template-columns:1fr 1fr;margin-top:0"><div><span>貯金残高</span><b class="' + (led.balance < 0 ? 'bad' : '') + '">' + numText(led.balance) + '</b></div>' +
          '<div><span>' + (isToday ? '今日' : 'この日') + 'の引き出し</span><b>' + fmt(cur) + '</b></div></div>';
        if (isToday) {
          if (led.balance < 0) html += '<p class="hint bad">貯金がマイナスのため、新しく引き出せません。今後の報酬で解消されます。</p>';
          else if (canAdd <= 0) html += '<p class="hint">いま引き出せる貯金はありません。</p>';
          else {
            const q = [100, 200, 300, 500].filter((v) => v < canAdd);
            html += '<form data-form="withdraw" novalidate>' + field('引き出す量',
              '<div class="unit" data-unit="kcal"><input class="input big" id="wf-amt" inputmode="numeric" autocomplete="off" placeholder="0"></div><div class="quick">' +
              q.map((v) => '<button type="button" data-act="wdQuick" data-v="' + v + '">' + v + '</button>').join('') +
              '<button type="button" data-act="wdQuick" data-v="' + canAdd + '">最大 ' + fmt(canAdd) + '</button></div>', '今日の予算に足されます。最大 ' + fmt(canAdd) + ' kcal。', 'wf-amt') +
              '<p class="hint bad" id="wf-err" role="alert"></p><div class="btn-row"><button class="btn primary" type="submit">引き出して予算に足す</button></div></form>';
          }
        } else if (!cur) {
          html += '<p class="hint">引き出しは当日に行います。過去の日の予算超過は、貯金から自動で補填されます。</p>';
        }
        if (cur > 0) {
          html += '<h3 class="dv-h"><span>' + (isToday ? '今日' : 'この日') + 'の引き出しを変更</span></h3><form data-form="withdrawSet" novalidate><div style="display:flex;gap:8px"><div class="unit" data-unit="kcal" style="flex:1">' +
            '<input class="input" id="ws-amt" inputmode="numeric" autocomplete="off" value="' + cur + '" aria-label="引き出しの合計"></div><button class="btn" type="submit">変更する</button></div>' +
            '<p class="hint">' + (isToday ? '合計を ' + fmt(maxTotal) + ' kcal まで変えられます。' : '過去の日は減らすか取り消すことができます。') + '</p><p class="hint bad" id="ws-err" role="alert"></p></form>' +
            '<div class="btn-row"><button class="btn danger" data-act="wdCancel" data-date="' + p.date + '">引き出しを取り消す</button></div>';
        }
        html += '<div class="note-box">使わなかった分は締め時刻（' + hmLabel(closeTime()) + '）に自動で貯金へ戻ります。食事が予算を超えたときは、引き出さなくても貯金から自動で補填されます。<br>' + HEALTH_SHORT + '</div>';
        return html;
      },
    },
    bank: {
      live: true,
      full: true,
      title: () => 'カロリー貯金（通帳）',
      body(p) {
        const c = ctx();
        const t = c.today;
        const led = c.ledger;
        const L = c.day(t);
        const subs = [];
        if (led.pending > 0) subs.push('精算保留 +' + fmt(led.pending) + '（食事未確認 ' + led.pendingDays.length + '日）');
        if (L.unusedReward + L.unusedW > 0) subs.push('今日の締めで +' + fmt(L.unusedReward + L.unusedW) + ' 予定');
        subs.push('期限なし');
        let html = '<div class="pb-top"><span class="lbl">いまの残高</span><span class="val' + (led.balance < 0 ? ' neg' : '') + '">' + numText(led.balance) + '<small>kcal</small></span><span class="subs">' + subs.map((s) => '<span>' + s + '</span>').join('') + '</span></div>';
        if (led.balance < 0) html += notice('bad', 'マイナス残高は、過去の記録の修正で引き出しの元手が足りなくなったためです。今後の報酬で解消され、それまでは引き出しできません。');
        const limit = p.limit || 30;
        const rows = [];
        let shown = 0;
        let more = false;
        for (let i = led.order.length - 1; i >= 0; i--) {
          const d = led.order[i];
          const Ld = led.days[d];
          const lines = E.ledgerLines(Ld);
          if (d === t && Ld.unusedReward + Ld.unusedW > 0) lines.push({ label: '締めで貯金予定', amount: Ld.unusedReward + Ld.unusedW, kind: 'pending' });
          if (!lines.length) continue;
          if (shown >= limit) { more = true; break; }
          shown++;
          rows.push('<tr class="dh"><td colspan="4">' + dateLabel(d) + (d === t ? ' ・ 締め前' : '') + '</td></tr>');
          let bal = Ld.balStart;
          for (const ln of lines) {
            const pend = ln.kind === 'pending';
            if (!pend) bal += ln.amount;
            rows.push('<tr' + (pend ? ' class="pend"' : '') + '><td>' + ln.label + '</td><td class="in">' + (pend ? '(+' + fmt(ln.amount) + ')' : ln.amount > 0 ? '+' + fmt(ln.amount) : '') + '</td>' +
              '<td class="out">' + (!pend && ln.amount < 0 ? '−' + fmt(ln.amount) : '') + '</td><td class="bal' + (bal < 0 ? ' neg' : '') + '">' + (pend ? '' : numText(bal)) + '</td></tr>');
          }
        }
        html += '<div class="btn-row"><button class="btn gold" data-act="withdraw" data-date="' + t + '">今日の予算に引き出す</button></div>';
        html += rows.length
          ? '<table class="pb-table"><thead><tr><th>内容</th><th>入金</th><th>出金</th><th>残高</th></tr></thead><tbody>' + rows.join('') + '</tbody></table>'
          : '<p class="empty">まだ入出金はありません。習慣を達成して報酬を残すと、締め時刻に貯金されます。</p>';
        if (more) html += '<div class="btn-row"><button class="btn ghost" data-act="pbMore">もっと前を表示</button></div>';
        html += '<div class="note-box">貯金のしくみ：上限を超えた報酬はすぐに入金。上限内で使わなかった報酬と、引き出しの残りは締め時刻に入金。食事が予算を超えると自動で出金（補填）します。<br>' + HEALTH_SHORT + '</div>';
        return html;
      },
    },

  // 並び替え（指でもマウスでも）。習慣の編集と、ToDoの一覧（Inbox・プロジェクト）で使う
  const sortItems = (list) => Array.from(list.children).filter((x) => x.matches('.mgr-item, .sortable-item'));
  function saveOrder(list) {
    const ids = sortItems(list).map((x) => x.dataset.id);
    if (list.dataset.sort === 'tasks') TodoAct.reorder(ids);
    else Act.reorder(ids);
  }
  function startDrag(ev, li) {
    if (!li || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    ev.preventDefault();
    const list = li.parentElement;
    const lr0 = list.getBoundingClientRect();
    const r = li.getBoundingClientRect();
    const offset = ev.clientY - r.top;
    const ph = document.createElement('li');
    ph.className = 'mgr-ph';
    ph.style.height = r.height + 'px';
    list.insertBefore(ph, li);
    li.classList.add('dragging');
    li.style.top = (r.top - lr0.top) + 'px';
    dragging = true;
    const scroller = li.closest('.sheet-body');
    const move = (e) => {
      const lr = list.getBoundingClientRect();
      const y = Math.max(-8, Math.min(e.clientY - lr.top - offset, lr.height - r.height + 8));
      li.style.top = y + 'px';
      let before = null;
      for (const it of sortItems(list)) {
        if (it === li) continue;
        const ir = it.getBoundingClientRect();
        if (e.clientY < ir.top + ir.height / 2) { before = it; break; }
      }
      if (before) { if (ph.nextElementSibling !== before) list.insertBefore(ph, before); }
      else if (list.lastElementChild !== ph) list.appendChild(ph);
      if (scroller) {
        const sr = scroller.getBoundingClientRect();
        if (e.clientY < sr.top + 48) scroller.scrollTop -= 10;
        else if (e.clientY > sr.bottom - 48) scroller.scrollTop += 10;
      } else if (e.clientY < 60) window.scrollBy(0, -10);
      else if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 10);
    };
    const end = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      window.removeEventListener('pointercancel', end);
      li.classList.remove('dragging');
      li.style.top = '';
      list.insertBefore(li, ph);
      ph.remove();
      dragging = false;
      saveOrder(list);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  }
  document.addEventListener('pointerdown', (ev) => {
    const g = ev.target.closest('[data-grip]');
    if (g) startDrag(ev, g.closest('.mgr-item, .sortable-item'));
  });
  document.addEventListener('keydown', (ev) => {
    const g = ev.target.closest && ev.target.closest('[data-grip]');
    if (!g || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
    ev.preventDefault();
    const li = g.closest('.mgr-item, .sortable-item');
    const list = li.parentElement;
    const items = sortItems(list);
    const i = items.indexOf(li);
    const j = ev.key === 'ArrowUp' ? i - 1 : i + 1;
    if (j < 0 || j >= items.length) return;
    if (ev.key === 'ArrowUp') list.insertBefore(li, items[j]);
    else list.insertBefore(items[j], li);
    const id = li.dataset.id;
    saveOrder(list);
    const again = document.querySelector('[data-id="' + id + '"] > [data-grip], .mgr-item[data-id="' + id + '"] [data-grip]');
    if (again) again.focus();
  });

  // ===================== 外部同期（デモ） =====================
  function runSync(auto) {
    if (!isDemo() || App.sync.state === 'syncing') return;

      const keys = replaceMeals(res.meals, res.added.concat(res.changed, res.removed));
      ext.lastSyncAt = Date.now();
      App.sync = { state: 'done' };
      commit(['core'].concat(keys));
      const parts = [];
      if (res.added.length) parts.push(res.added.length + '件追加');
      if (res.changed.length) parts.push(res.changed.length + '件変更');
      if (res.removed.length) parts.push(res.removed.length + '件削除');
      if (parts.length) toast('ヘルスケア（デモ）から食事を' + parts.join('・') + 'しました');
      else if (!auto) toast('新しい食事はありません');
    }, 1100);

  // ===================== 保存 =====================
  function normalizeMonth(m) {
    m = m && typeof m === 'object' ? m : {};
    return {
      entries: Array.isArray(m.entries) ? m.entries : [],
      meals: Array.isArray(m.meals) ? m.meals : [],
      withdrawals: m.withdrawals && typeof m.withdrawals === 'object' ? m.withdrawals : {},
      confirmed: m.confirmed && typeof m.confirmed === 'object' ? m.confirmed : {},
    };
  }
  function normalizeCore(c) {
    if (!c || !c.settings || !Array.isArray(c.settings.history) || !c.settings.history.length || !Array.isArray(c.habits)) return null;
    delete c._by; delete c._at;
    c.settings.closeTime = c.settings.closeTime || '00:00';
    c.settings.reminder = Object.assign({ enabled: false, time: '21:00' }, c.settings.reminder);
    c.ext = Object.assign({ mode: 'none', offline: false, lastSyncAt: null, source: [] }, c.ext);
    c.habits.forEach((h, i) => { if (typeof h.order !== 'number') h.order = i; if (!Array.isArray(h.status)) h.status = []; });
    c.startDate = c.startDate || c.settings.history[0].from;
    return c;
  }
  function normalizeTodo(t) {
    if (!t || typeof t !== 'object') return E.emptyTodo();
    delete t._by; delete t._at;
    for (const k of ['projects', 'sections', 'labels', 'tasks']) if (!Array.isArray(t[k])) t[k] = [];
    t.settings = Object.assign({ defaultReward: 50 }, t.settings);
    t.tasks.forEach((x) => { if (!Array.isArray(x.labels)) x.labels = []; });
    return t;
  }
  function normalizeComps(c) {
    c = c && typeof c === 'object' ? c : {};
    return { completions: Array.isArray(c.completions) ? c.completions : [] };
  }
  /** その月にアプリを開いた日（ログインボーナスを受け取った日） */
  function normalizeLogins(l) {
    const days = l && Array.isArray(l.days) ? l.days.filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d)) : [];
    return { days: Array.from(new Set(days)).sort() };
  }
  /** 開いた日は消えることがないので、2つの記録を合わせる */
  function mergeLogins(a, b) { return normalizeLogins({ days: ((a && a.days) || []).concat((b && b.days) || []) }); }
  /** 保存の単位：core（設定・習慣）、todo（タスク一式）、'YYYY-MM'（月の記録）、'c-YYYY-MM'（月のToDo完了記録）、'l-YYYY-MM'（月の開いた日） */
  function docBody(k) {
    if (k === 'core') return App.data.core;
    if (k === 'todo') return App.data.todo;
    if (k.indexOf('c-') === 0) return App.data.comps[k.slice(2)] || { completions: [] };
    if (k.indexOf('l-') === 0) return App.data.logins[k.slice(2)] || { days: [] };
    return App.data.months[k] || emptyMonth();
  }
  function fromDocs(docs) {
    let core = null;
    let todo = null;
    const months = {};
    const comps = {};
    const logins = {};
    for (const d of docs) {
      if (d.id === 'core') core = normalizeCore(clone(d.data));
      else if (d.id === 'todo') todo = normalizeTodo(clone(d.data));
      else if (d.id.indexOf('c-') === 0) comps[d.id.slice(2)] = normalizeComps(clone(d.data));
      else if (d.id.indexOf('l-') === 0) logins[d.id.slice(2)] = normalizeLogins(d.data);
      else if (d.id.indexOf('m-') === 0) {
        const m = clone(d.data);
        delete m._by; delete m._at;
        months[d.id.slice(2)] = normalizeMonth(m);
      }
    }
    return core ? { core, months, todo: todo || E.emptyTodo(), comps, logins } : null;
  }
  function toDocs(f) {
    const months = {};
    const comps = {};
    const m = (date) => months[E.monthKey(date)] || (months[E.monthKey(date)] = emptyMonth());
    f.entries.forEach((e) => m(e.date).entries.push(e));
    f.meals.forEach((x) => m(x.date).meals.push(x));
    Object.keys(f.withdrawals).forEach((d) => { m(d).withdrawals[d] = f.withdrawals[d]; });
    Object.keys(f.confirmed).forEach((d) => { m(d).confirmed[d] = f.confirmed[d]; });
    (f.completions || []).forEach((c) => {
      const k = E.monthKey(c.date);
      (comps[k] || (comps[k] = { completions: [] })).completions.push(c);
    });
    const logins = {};
    Object.keys(f.logins || {}).forEach((d) => {
      const k = E.monthKey(d);
      (logins[k] || (logins[k] = { days: [] })).days.push(d);
    });
    return { core: f.core, months, todo: f.todo || E.emptyTodo(), comps, logins };
  }
  function allKeys() {
    return ['core', 'todo'].concat(Object.keys(App.data.months), Object.keys(App.data.comps).map((k) => 'c-' + k), Object.keys(App.data.logins).map((k) => 'l-' + k));
  }

  const Store = {
    mode: 'memory',
    adapter: null,
    dirty: new Set(),
    busy: false,
    timer: null,
    retry: null,
    problem: '',
    /** quiet：アカウントから受け取った変更を手元に保存するだけのとき（送り返さない） */
    markDirty(k, quiet) {
      if (!quiet) Sync.touch(k);
      if (!this.adapter) {
        if (!this.problem) this.problem = '保存できない環境です。ページを閉じると記録が消えるため、設定からバックアップを書き出してください。';
        return;
      }
      this.dirty.add(k);
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.flush(), 450);
    },
    async flush() {
      if (this.busy || !this.adapter) return;
      this.busy = true;
      try {
        while (this.dirty.size) {
          if (this.adapter.whole) {
            const keys = Array.from(this.dirty);
            this.dirty.clear();
            if (!App.data || App.sample) continue;
            try {
              await this.adapter.write();
              if (this.problem) { this.problem = ''; render(); }
            } catch (e) {
              for (const k of keys) this.dirty.add(k);
              this.fail(e);
              break;
            }
            continue;
          }
          const k = this.dirty.values().next().value;
          this.dirty.delete(k);
          if (!App.data || App.sample) continue;
          try {
            await this.adapter.write(k);
            if (this.problem) { this.problem = ''; render(); }
          } catch (e) {
            this.dirty.add(k);
            this.fail(e);
            break;
          }
        }
      } finally {
        this.busy = false;
      }
    },
    fail(e) {
      const code = e && e.code;
      let msg = '保存できませんでした。通信状態を確認してください。自動でもう一度保存します。';
      let wait = 15000;
      if (code === 'unavailable') wait = 2500 + Math.random() * 2500;
      if (code === 'quota_exceeded') msg = '保存できる容量の上限に達しました。バックアップを書き出してから、不要なデータを整理してください。';
      if (code === 'invalid_argument') msg = 'このページでは記録を保存できません（権限がありません）。';
      if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') msg = 'このページでは保存できなくなりました。ページを開き直してください。';
      if (Store.mode === 'local') msg = 'このブラウザに保存できませんでした。空き容量やプライベートブラウズの設定を確認してください。';
      if (Store.mode === 'device') msg = 'iPhoneに保存できませんでした。空き容量を確認してください。自動でもう一度保存します。';
      this.problem = msg;
      render();
      clearTimeout(this.retry);
      this.retry = setTimeout(() => this.flush(), wait);
    },
    /** 画面を閉じる前などに、待たずに保存する */
    flushNow() {
      clearTimeout(this.timer);
      if (this.dirty.size) this.flush();
    },
    async writeAll() {
      if (!this.adapter) return;
      for (const k of allKeys()) this.dirty.add(k);
      await this.flush();
    },
    async clear() {
      this.dirty.clear();
      clearTimeout(this.timer);
      if (this.adapter && this.adapter.clear) await this.adapter.clear();
    },
  };

  const Local = {
    KEY: 'habit-kcal-v1',
    whole: true,
    read() {
      try {
        const s = window.localStorage.getItem(this.KEY);
        this.ok = true;
        return s ? JSON.parse(s) : null;
      } catch (e) {
        this.ok = false;
        return null;
      }
    },
    async write() {
      window.localStorage.setItem(this.KEY, JSON.stringify({ core: App.data.core, months: App.data.months, todo: App.data.todo, comps: App.data.comps, logins: App.data.logins }));
    },
    async clear() {
      try { window.localStorage.removeItem(this.KEY); } catch (e) { /* 無視 */ }
    },
  };

  const Cloud = {
    col: null,
    tab: newId('tab'),
    known: new Set(),
    docId(k) { return k === 'core' || k === 'todo' || k.indexOf('c-') === 0 || k.indexOf('l-') === 0 ? k : 'm-' + k; },
    keyOf(id) {
      if (id === 'core' || id === 'todo' || id.indexOf('c-') === 0 || id.indexOf('l-') === 0) return id;
      return id.indexOf('m-') === 0 ? id.slice(2) : null;
    },
    async write(k) {
      const body = clone(docBody(k));
      body._by = this.tab;
      body._at = Date.now();
      await this.col.doc(this.docId(k)).set(body);
      this.known.add(this.docId(k));
    },
    async clear() {
      this.clearing = true;
      try {
        const ids = Array.from(this.known).sort((a, b) => (a === 'core') - (b === 'core')); // core は最後
        for (const id of ids) {
          await this.col.doc(id).delete();
          this.known.delete(id);
        }
      } finally {
        this.clearing = false;
      }
    },
    start(db, uid) {
      return new Promise((resolve) => {
        let settled = false;
        const finish = (ok) => { if (!settled) { settled = true; resolve(ok); } };
        try {
          this.col = db.collection('data/users/' + uid);
        } catch (e) {
          finish(false);
          return;
        }
        const slow = setTimeout(() => { App.loadSlow = true; if (!App.data) render(); }, 10000);
        this.col.onSnapshot((snap) => {
          if (!snap.metadata.fromCache) { clearTimeout(slow); App.loadSlow = false; }
          const docs = snap.docs.map((d) => ({ id: d.id, data: d.data() }));
          for (const d of docs) this.known.add(d.id);
          if (!settled) {
            if (snap.metadata.fromCache && snap.empty) return; // 確かな結果を待つ
            const data = fromDocs(docs);
            if (data) { App.data = data; App.sample = false; App.rev++; }
            finish(true);
            return;
          }
          applyRemote(snap, docs);
        }, (err) => {
          clearTimeout(slow);
          if (!settled) { finish(false); return; }
          Store.problem = 'クラウドとの同期が止まりました（' + ((err && err.code) || 'error') + '）。ページを開き直すと再開します。';
          render();
        });
      });
    },
  };
  /** ほかの端末での変更を反映する。まだ保存していない手元の変更があれば、手元を優先する */
  function applyRemote(snap, docs) {
    if (Cloud.clearing) return; // この画面で消去中
    if (App.sample) {
      const data = fromDocs(docs);
      if (data) {
        App.data = data;
        App.sample = false;
        App.sync = { state: 'idle' };
        App.rev++;
        closeAllSheets();
        render();
        toast('ほかの端末で始めたデータを読み込みました');
      }
      return;
    }
    let changed = false;
    for (const ch of snap.docChanges()) {
      const id = ch.doc.id;
      const k = Cloud.keyOf(id);
      if (!k) continue;
      if (ch.type === 'removed') {
        Cloud.known.delete(id);
        if (Store.dirty.has(k)) continue;
        if (k === 'core') {
          enterSample();
          closeAllSheets();
          render();
          toast('ほかの端末でデータが消去されました');
          return;
        }
        if (k === 'todo') App.data.todo = E.emptyTodo();
        else if (k.indexOf('c-') === 0) delete App.data.comps[k.slice(2)];
        else if (k.indexOf('l-') === 0) delete App.data.logins[k.slice(2)];
        else delete App.data.months[k];
        changed = true;
        continue;
      }
      const body = ch.doc.data();
      if (!body || body._by === Cloud.tab) continue; // この画面が書いたもの
      if (k.indexOf('l-') === 0) {
        const mk = k.slice(2);
        const merged = mergeLogins(App.data.logins[mk], body);
        if (merged.days.length > normalizeLogins(body).days.length) Store.markDirty(k); // こちらにしかない日を送り返す
        App.data.logins[mk] = merged;
        changed = true;
        continue;
      }
      if (Store.dirty.has(k)) continue;
      if (k === 'core') {
        const core = normalizeCore(clone(body));
        if (core) App.data.core = core;
      } else if (k === 'todo') {
        App.data.todo = normalizeTodo(clone(body));
      } else if (k.indexOf('c-') === 0) {
        App.data.comps[k.slice(2)] = normalizeComps(clone(body));
      } else {
        const m = clone(body);
        delete m._by; delete m._at;
        App.data.months[k] = normalizeMonth(m);
      }
      changed = true;
    }
    if (changed) { App.rev++; render(); }
  }

  /** クラウドに残っている、いまのデータにない月の記録を消す（初回設定・復元のとき） */
  async function pruneCloud() {

    if (Store.mode !== 'cloud' || !Cloud.col) return;
    const keep = new Set(allKeys().map((k) => Cloud.docId(k)));
    for (const id of Array.from(Cloud.known)) {
      if (keep.has(id)) continue;
      try { await Cloud.col.doc(id).delete(); Cloud.known.delete(id); } catch (e) { /* 次の機会に */ }
    }
  }

  // ===================== ログインボーナス =====================

  // claude.ai の中で開いたとき（window.claude がある）は使わない。
  const FIRE = { apiKey: 'AIzaSyBj10_kq3w8TwtpXqMohGAMYaF_oCXKWYk', projectId: 'calotas' };

  const Account = {

    FILE: 'calotas-account.json',

    idExp: 0,

    knownSignedIn() {

  // ---- 通信 ----
  function fireError(body, status) {
    const e = body && (Array.isArray(body) ? (body.find((x) => x && x.error) || {}).error : body.error);
    const msg = (e && (e.message || e.status)) || 'HTTP ' + status;
    const err = new Error(msg);
    err.code = String(msg).split(/[\s:]/)[0];
    err.status = status;
    return err;
  }
  async function fireFetch(url, init) {
    let res;
    try {
      res = await fetch(url, init);
    } catch (e) {
      const err = new Error('network');
      err.code = 'NETWORK';
      throw err;
    }
    let body = null;
    try { const text = await res.text(); body = text ? JSON.parse(text) : null; } catch (e) { body = null; }
    if (!res.ok) throw fireError(body, res.status);
    if (Array.isArray(body) && body.some((x) => x && x.error)) throw fireError(body, res.status);
    return body;
  }
  function authPost(method, payload) {
    return fireFetch(FIRE_AUTH + method + '?key=' + FIRE.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  }

  // ---- Googleでログイン ----
  // Web（PC）：Google の公式ボタン（Google Identity Services）で ID トークンを受け取る
  // iPhone：アプリの中の画面では Google がログインを許可しないため、ネイティブの部品（SocialLogin）で受け取る
  // クライアントIDは公開してよい識別子（秘密の鍵ではない）
  const GOOGLE = {
    web: '182928285479-5jf3rk26q27f4ba6b6o5vkkcdif2s0mm.apps.googleusercontent.com',
    ios: '182928285479-62qat7jal32n8ri70ajpl443sjnqivc1.apps.googleusercontent.com',
  };
  function gErr(code) { const e = new Error(code); e.code = code; return e; }
  const Google = {
    gis: null, // 公式ボタンのスクリプトを読み込む Promise
    gisInit: false,
    handler: null, // いま開いている画面の受け取り口 { ok(tok), fail(e) }
    native: null, // iPhone の部品の準備
    loadGis() {
      if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
      if (!this.gis) {
        this.gis = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://accounts.google.com/gsi/client';
          s.async = true;
          s.onload = () => (window.google && window.google.accounts && window.google.accounts.id ? resolve() : reject(gErr('GOOGLE_UNAVAILABLE')));
          s.onerror = () => reject(gErr('GOOGLE_UNAVAILABLE'));
          document.head.appendChild(s);
        }).catch((e) => { this.gis = null; throw e; });
      }
      return this.gis;
    },
    /** Web：el に Google の公式ボタンを描く。ログインできたら handler.ok({ idToken }) */
    async button(el, handler) {
      this.handler = handler;
      try {
        await this.loadGis();
      } catch (e) {
        if (el.isConnected && this.handler === handler) handler.fail(e);
        return;
      }
      if (!el.isConnected) return;
      const id = window.google.accounts.id;
      if (!this.gisInit) {
        id.initialize({
          client_id: GOOGLE.web,
          callback: (resp) => { const h = this.handler; if (h && resp && resp.credential) h.ok({ idToken: resp.credential }); },
          ux_mode: 'popup',
          auto_select: false,
          itp_support: true,
          use_fedcm_for_button: true,
        });
        this.gisInit = true;
      }
      el.innerHTML = '';
      id.renderButton(el, { type: 'standard', theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', logo_alignment: 'left', locale: 'ja', width: Math.max(220, Math.min(320, el.clientWidth || 280)) });
    },
    ensureNative() {
      if (!this.native) {
        this.native = Native.call('SocialLogin', 'initialize', { google: { iOSClientId: GOOGLE.ios, webClientId: GOOGLE.web, mode: 'online' } })
          .catch((e) => { this.native = null; throw e; });
      }
      return this.native;
    },
    /** iPhone：Google のログイン画面を出して ID トークンを受け取る（choose なら前回のアカウントを使わず選んでもらう） */
    async nativeToken(choose) {
      await this.ensureNative();
      const r = await Native.call('SocialLogin', 'login', { provider: 'google', options: choose ? { forcePrompt: true } : {} });
      const tok = r && r.result && r.result.idToken;
      if (!tok) throw gErr('GOOGLE_NO_TOKEN');

    /** ログアウトしたとき：次は Google のアカウントを選び直せるようにする */
    signOut() {

  /** Google の ID トークンの中身（メールアドレスなど）。署名の確認は Firebase が行う */
  function tokenClaims(t) {
    try {
      const b = String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(b + '==='.slice((b.length + 3) % 4));
      return JSON.parse(decodeURIComponent(Array.prototype.map.call(bin, (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
    } catch (e) {
      return {};
    }
  }
  /** Google の ID トークンで Firebase にログインする（初めてなら、そのままアカウントができる） */
  async function googleAuth(tok) {
    const r = await authPost('signInWithIdp', {
      postBody: 'id_token=' + encodeURIComponent(tok.idToken) + '&providerId=google.com',
      requestUri: /^https?:$/.test(location.protocol) ? location.origin + '/' : 'http://localhost/',
      returnSecureToken: true,
      returnIdpCredential: true,
    });
    if (!r || !r.idToken || !r.localId) throw gErr(r && r.needConfirmation ? 'NEED_CONFIRMATION' : 'INVALID_IDP_RESPONSE');
    return r;
  }
  async function idToken(force) {
    if (!Account.st) { const e = new Error('signed out'); e.code = 'SIGNED_OUT'; throw e; }
    if (!force && Account.idToken && Date.now() < Account.idExp) return Account.idToken;
    const r = await fireFetch(FIRE_TOKEN + '?key=' + FIRE.apiKey, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(Account.st.refresh),
    });

    Account.idExp = Date.now() + (Number(r.expires_in || 3600) - 300) * 1000;
    if (r.refresh_token && r.refresh_token !== Account.st.refresh) { Account.st.refresh = r.refresh_token; Account.save(); }
    return Account.idToken;
  }
  async function dbPost(path, payload) {
    const send = (t) => fireFetch(FIRE_DB + path, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t }, body: JSON.stringify(payload) });
    try {
      return await send(await idToken());
    } catch (e) {
      if (e.status !== 401) throw e;
      return send(await idToken(true)); // 鍵の期限切れ：取り直して1回だけやり直す
    }
  }

  // ---- Firestore の文書 ----
  /** Firestore の時刻（RFC3339）を、文字のまま大小を比べられる形にそろえる */
  function tsKey(ts) {
    const m = /^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.(\d+))?Z$/.exec(ts || '');
    return m ? m[1] + '.' + (m[2] || '').padEnd(9, '0').slice(0, 9) + 'Z' : '';
  }
  function docWrite(uid, id, op) {
    const del = op === 'del';
    return {
      update: {
        name: FIRE_NAME + '/users/' + uid + '/docs/' + id,
        fields: { json: { stringValue: del ? '' : JSON.stringify(docBody(Cloud.keyOf(id))) }, by: { stringValue: Account.st.device }, del: { booleanValue: del } },
      },
      updateTransforms: [{ fieldPath: 'at', setToServerValue: 'REQUEST_TIME' }],
    };
  }
  function readDoc(d) {
    const f = d.fields || {};
    return {
      id: d.name.slice(d.name.lastIndexOf('/') + 1),
      json: (f.json && f.json.stringValue) || '',
      by: (f.by && f.by.stringValue) || '',
      del: !!(f.del && f.del.booleanValue),
      at: (f.at && f.at.timestampValue) || '',
      ut: d.updateTime || '',
    };
  }
  /** アカウントの記録を受け取る。all なら全部、そうでなければ前回以降に変わったものだけ */
  async function pullDocs(all) {
    const st = Account.st;
    const q = { from: [{ collectionId: 'docs' }] };
    if (!all && st.lastSeen) {
      // 同じころに書かれた記録を取りこぼさないよう、10秒さかのぼって聞く（受け取り済みは updateTime で見分ける）
      const since = new Date(Date.parse(st.lastSeen) - 10000).toISOString();
      q.where = { fieldFilter: { field: { fieldPath: 'at' }, op: 'GREATER_THAN_OR_EQUAL', value: { timestampValue: since } } };
      q.orderBy = [{ field: { fieldPath: 'at' }, direction: 'ASCENDING' }];
    }
    const rows = await dbPost('/users/' + st.uid + ':runQuery', { structuredQuery: q });
    return (rows || []).filter((r) => r && r.document).map((r) => readDoc(r.document));
  }

    const st = Account.st;
    for (const d of docs) {
      st.seen[d.id] = [d.ut, d.del ? 1 : 0];
      if (tsKey(d.at) > tsKey(st.lastSeen)) st.lastSeen = d.at;
    }
  }
  function liveIds() {
    const st = Account.st;
    return Object.keys(st.seen).filter((id) => !st.seen[id][1]);

  /** アカウントの記録（生きている文書）からアプリのデータを組み立てる */
  function dataFromRemote(docs) {
    const list = [];
    for (const d of docs) {
      if (d.del) continue;
      try { list.push({ id: d.id, data: JSON.parse(d.json) }); } catch (e) { /* 壊れた文書は飛ばす */ }
    }
    return fromDocs(list);
  }
  function hasOwnData() {
    if (!App.data || App.sample) return false;
    const months = Object.values(App.data.months);
    return App.data.core.habits.length > 0 || App.data.todo.tasks.length > 0 || months.some((m) => m.entries.length || m.meals.length);
  }
  function dataSummary(data) {
    const days = new Set();
    for (const m of Object.values(data.months)) {
      for (const e of m.entries) days.add(e.date);
      for (const x of m.meals) days.add(x.date);
    }
    return { habits: data.core.habits.filter((h) => !h.archived).length, tasks: data.todo.tasks.filter((x) => !x.parentId && !x.done).length, days: days.size };
  }

  // ---- 同期 ----
  const Sync = {
    state: 'off', // off | busy | ok | offline | error
    msg: '',
    running: null,
    again: false,
    timer: null,
    poll: null,
    ver: {}, // 文書ごとの変更回数（送っている間にまた変わったかを見分ける）
    firstDone: false, // 起動してから一度でも同期できたか
    early: new Set(), // ログイン状態を読み込む前（起動直後）に変わった保存の単位
    choice: null, // { remote: data, docs }：どちらの記録を使うか選ぶとき
    setState(s, msg) {

      this.msg = msg || '';

    },
    /** 手元の変更を記録して、少し待ってから送る */
    touch(k) {

        return;

      const id = Cloud.docId(k);
